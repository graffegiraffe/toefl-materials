er stars.", "It did not form in a molecular cloud.", "It developed faster than most other stars did."], "answer": "A", "why": "The new observations are <em>“surprising”<\/em> because they suggest the Sun had a twin. So the earlier belief was most likely that it did not.", "others": ["<b>B, D:<\/b> the Sun’s size and speed of development are not challenged.", "<b>C:<\/b> the passage says all stars form in molecular clouds; nothing suggests scientists once thought otherwise."]}, {"n": 34, "stem": "What do the <mark>“estimates”<\/mark> discussed in the passage refer to?", "options": ["The rate at which stars grow in the molecular cloud", "The course that stars move along within the molecular cloud", "The number of binary star systems found in the molecular cloud", "The number of stars that have formed within the molecular cloud"], "answer": "B", "why": "Scientists <em>“predict[ed] the paths along which binary stars traveled throughout the molecular cloud.”<\/em> <mark>Their estimates<\/mark> are those predicted paths.", "others": ["<b>A:<\/b> knowledge of stellar growth was the tool, not what was estimated.", "<b>C, D:<\/b> numbers of stars or systems were observed, not estimated."]}]}];
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let cur = 0;
let picks = {};      // set index -> {qIndex: letter}
let checked = {};    // set index -> true when checked
let results = store.get("toefl-reading-results") || {}; // title -> "4/5"

const $ = id => document.getElementById(id);
const totalQ = SETS.reduce((a,s)=>a+s.questions.length,0);
$("summary").textContent = `${SETS.length} passages · ${totalQ} questions · answer key with explanations`;

function rangeOf(s){ const a=s.questions[0].n, b=s.questions[s.questions.length-1].n; return `Questions ${a}–${b}`; }

function renderNav(){
  const list = $("setlist"); list.innerHTML = "";
  const pick = $("setpick"); pick.innerHTML = "";
  SETS.forEach((s,i)=>{
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("aria-current", i===cur ? "true":"false");
    const r = results[s.title];
    b.innerHTML = `<span class="num">${i+1}</span><span>${s.title}</span>` + (r ? `<span class="done">Score: ${r}</span>` : "");
    b.onclick = ()=>go(i);
    list.appendChild(b);
    const o = document.createElement("option"); o.value = i; o.textContent = `${i+1}. ${s.title}` + (r ? ` (${r})` : "");
    if (i===cur) o.selected = true; pick.appendChild(o);
  });
}
$("setpick").onchange = e => go(+e.target.value);

function render(){
  const s = SETS[cur];
  $("settitle").textContent = s.title;
  $("setmeta").textContent = rangeOf(s);
  $("passage").innerHTML = s.paras.map((p,i)=>`<p>${s.paras.length>1?`<span class="pn">¶${i+1}</span>`:""}${p}</p>`).join("");
  const mine = picks[cur] || (picks[cur] = {});
  const isChecked = !!checked[cur];
  const qs = $("questions"); qs.innerHTML = "";
  s.questions.forEach((q,qi)=>{
    const card = document.createElement("div");
    card.className = "q" + (isChecked ? " checked" : "");
    const opts = q.options.map((o,oi)=>{
      const L = "ABCD"[oi];
      let cls = "opt";
      if (isChecked){ if (L===q.answer) cls += " right"; else if (mine[qi]===L) cls += " wrong"; }
      return `<button type="button" class="${cls}" data-q="${qi}" data-l="${L}" aria-pressed="${mine[qi]===L}" ${isChecked?'aria-disabled="true"':""}><span class="l">${L}</span><span>${o}</span></button>`;
    }).join("");
    let after = "";
    if (isChecked){
      const ok = mine[qi]===q.answer;
      const v = mine[qi] ? (ok ? `<span class="verdict ok">Correct</span>` : `<span class="verdict no">Your answer: ${mine[qi]} · Correct answer: ${q.answer}</span>`) : `<span class="verdict no">Not answered · Correct answer: ${q.answer}</span>`;
      after = `<div class="why">${v}<div>${q.why}</div>${q.others.length?`<ul>${q.others.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}</div>`;
    }
    card.innerHTML = `<div class="stem"><span class="badge">${q.n}</span><div>${q.stem}</div></div><div class="opts">${opts}</div>${after}`;
    qs.appendChild(card);
  });
  qs.querySelectorAll(".opt").forEach(b=>b.onclick = ()=>{
    if (checked[cur]) return;
    mine[b.dataset.q] = b.dataset.l; render();
  });
  const answered = Object.keys(mine).length;
  $("check").disabled = isChecked;
  $("reveal").hidden = isChecked;
  if (isChecked){
    const n = s.questions.filter((q,qi)=>mine[qi]===q.answer).length;
    $("score").textContent = `Score: ${n} / ${s.questions.length}`;
    $("hint").textContent = "Explanations are shown under each question.";
  } else {
    $("score").textContent = "";
    $("hint").textContent = answered < s.questions.length ? `${answered} of ${s.questions.length} answered.` : "All answered. Check your answers when you're ready.";
  }
}
function go(i){
  cur = i; store.set("toefl-reading-current", i);
  try { history.replaceState(null, "", "#set" + (i+1)); } catch(e){}
  renderNav(); render(); window.scrollTo({top:0});
}
$("check").onclick = ()=>{
  const s = SETS[cur], mine = picks[cur] || {};
  checked[cur] = true;
  const n = s.questions.filter((q,qi)=>mine[qi]===q.answer).length;
  if (Object.keys(mine).length){ results[s.title] = `${n}/${s.questions.length}`; store.set("toefl-reading-results", results); }
  renderNav(); render();
};
$("reveal").onclick = ()=>{ checked[cur] = true; renderNav(); render(); };
$("reset").onclick = ()=>{ picks[cur] = {}; checked[cur] = false; render(); };

const h = location.hash.match(/^#set(\d+)$/);
const saved = store.get("toefl-reading-current");
cur = h ? Math.min(Math.max(+h[1]-1,0), SETS.length-1) : (Number.isInteger(saved) && saved < SETS.length ? saved : 0);
renderNav(); render();
</script>

</body></html>
