<script>
const SETS = [{"title": "The Domestication of Maize", "offset": 0, "paras": ["Maize, also known as corn, is one of the world's most important crops. Scholars studying its domestication have debated about how a wild grass with <mark>limited utility<\/mark> transformed into a globally significant staple. The dominant theory, supported by genetic and archaeological evidence, posits that maize was domesticated from wild teosinte (a species that, like modern maize, belongs to the <i>Zea<\/i> genus) in southwestern Mexico roughly 9,000 years ago. Proponents argue that early cultivators selectively bred plants exhibiting desirable traits—larger kernels, reduced seed casings, and more robust cobs—thereby accelerating the cultivated plants' divergence from teosinte. This model is reinforced by analyses demonstrating a close genetic relationship between modern maize and specific southwest Mexican teosinte populations.", "Alternative accounts have also been suggested. Some researchers propose a multiregional model, suggesting that while initial domestication occurred in Mexico, <mark>subsequent<\/mark> hybridization with other species of the <i>Zea<\/i> genus across Central America contributed to maize's eventual diversity. Another hypothesis highlights the possibility of protracted domestication, in which early foragers managed wild-growing teosinte long before fully domesticated maize emerged, blurring the boundary between cultivation and wild harvesting. Although consensus increasingly favors a single primary domestication event, ongoing discoveries continue to refine our understanding of one of the world's most transformative crops."], "questions": [{"n": 1, "stem": "The author mentions <mark>“limited utility”<\/mark> primarily to", "options": ["point out a shortcoming of maize as a globally significant staple", "explain why the domestication of wild teosinte did not occur earlier", "emphasize that wild teosinte was not an important nutritional source in Mexico 9,000 years ago", "suggest that the domestication of maize was remarkable"], "answer": "D", "why": "The author contrasts a wild grass with <em>“limited utility”<\/em> with <em>“a globally significant staple.”<\/em> The contrast shows how surprising the transformation was.", "others": ["<b>A:<\/b> “limited utility” describes the wild grass, not maize.", "<b>B, C:<\/b> the passage says nothing about timing or nutrition."]}, {"n": 2, "stem": "What can be inferred about wild teosinte available to early cultivators in southwestern Mexico?", "options": ["It grew more slowly than domesticated maize.", "Its kernels were smaller than those of domesticated maize.", "Its seed casings were thinner than the casings of domesticated maize.", "There is no trace of it in the archaeological evidence from southwestern Mexico."], "answer": "B", "why": "Early cultivators selected plants with <em>“larger kernels,”<\/em> so wild teosinte must have had smaller ones.", "others": ["<b>C:<\/b> the opposite is true. Cultivators selected <em>“reduced seed casings,”<\/em> so teosinte's casings were bigger or thicker.", "<b>A:<\/b> growth speed is not mentioned.", "<b>D:<\/b> contradicts the passage. The dominant theory is <em>“supported by… archaeological evidence.”<\/em>"]}, {"n": 3, "stem": "The dominant theory discussed differs from the multiregional model in that the dominant theory", "options": ["proposes that early cultivators bred plants with desirable traits", "proposes an earlier date for the domestication of maize", "names only one species as the ancestor of domesticated maize", "identifies Central America as the region in which maize was first domesticated"], "answer": "C", "why": "The dominant theory traces maize to wild teosinte alone. The multiregional model adds <em>“hybridization with other species of the Zea genus.”<\/em>", "others": ["<b>A:<\/b> selective breeding is not what separates the two models.", "<b>B:<\/b> no different date is given for the multiregional model.", "<b>D:<\/b> both models place the first domestication in Mexico. Central America is only where later hybridization happened."]}, {"n": 4, "stem": "The word <mark>“subsequent”<\/mark> in the passage is closest in meaning to", "options": ["rapid", "later", "steady", "frequent"], "answer": "B", "why": "<mark>Subsequent<\/mark> hybridization happened after the initial domestication in Mexico, so it means “later” or “following.”", "others": []}, {"n": 5, "stem": "The passage indicates which of the following about the protracted domestication hypothesis?", "options": ["It is considered unlikely by most researchers who study the domestication of maize.", "It is proven wrong by evidence concerning foragers' utilization of wild-growing plants.", "It may explain the genetic diversity of the <i>Zea<\/i> genus in Central America.", "It is responsible for a change in the way researchers define the term “domestication.”"], "answer": "A", "why": "After presenting the alternative accounts, the author writes: <em>“Although consensus increasingly favors a single primary domestication event…”<\/em> Most researchers therefore prefer the dominant theory over these alternatives.", "others": ["<b>B:<\/b> nothing proves the hypothesis wrong.", "<b>C:<\/b> diversity in Central America is linked to the multiregional model, not to protracted domestication.", "<b>D:<\/b> the hypothesis <em>“blurs the boundary”<\/em> between cultivation and harvesting, but the passage never says researchers changed the definition of domestication."]}]}, {"title": "The Second World War and American Women in the Workforce", "offset": 0, "paras": ["The Second World War created an <mark>acute<\/mark> labor shortage in the United States as millions of men entered military service, forcing factories, shipyards, and aircraft plants to seek new workers. In response, women were recruited into industrial jobs such as <mark>welding aircraft frames, assembling munitions, and operating heavy machinery<\/mark>—work that had previously been performed almost entirely by men. By 1945, women made up roughly 37 percent of the civilian labor force, an increase of about six million workers since 1940. Government campaigns framed this shift as both patriotic and temporary.", "Historians debate the significance of this wartime transformation. Some argue that women's employment marked a lasting break with traditional gender roles, as women demonstrated their ability to perform skilled industrial labor. While the war did not produce immediate equality, they argue it helped lay the groundwork for later movements advocating equal pay and broader access to skilled occupations in the decades that followed.", "Others stress the short-lived nature of the change. When the war ended and men returned home, defense contracts were canceled and women were often dismissed. Female labor-force participation fell sharply in 1945 and 1946, approaching prewar levels as many women were encouraged—or required—to leave their jobs."], "questions": [{"n": 1, "stem": "The word <mark>“acute”<\/mark> in the passage is closest in meaning to", "options": ["unexpected", "unwelcome", "severe", "growing"], "answer": "C", "why": "An <mark>acute<\/mark> shortage is a serious, intense one. Millions of men left for the military, so factories urgently needed workers.", "others": ["<b>A, D:<\/b> the passage says nothing about the shortage being sudden or gradually increasing."]}, {"n": 2, "stem": "Why does the author mention <mark>“welding aircraft frames, assembling munitions, and operating heavy machinery”<\/mark>?", "options": ["To acknowledge that certain kinds of work required specialized training", "To draw attention to the sectors with the greatest labor shortages", "To support the claim that 37 percent of the labor force worked in war industries", "To indicate the kinds of work that women began to perform during the Second World War"], "answer": "D", "why": "The phrase gives examples of the <em>“industrial jobs”<\/em> women were recruited into, work <em>“previously… performed almost entirely by men.”<\/em>", "others": ["<b>A:<\/b> training is not discussed.", "<b>B:<\/b> the shortages are described across factories, shipyards and aircraft plants, not ranked by sector.", "<b>C:<\/b> the 37 percent refers to the whole civilian labor force, not to these jobs."]}, {"n": 3, "stem": "What does the passage suggest about the government's attitude toward women performing industrial labor?", "options": ["The government did not believe that women could perform industrial work as well as men.", "The government expected women to work only during a brief period when men were unavailable.", "The government was concerned that women were not fulfilling their patriotic duties.", "The government began to send women back home in 1944 when the end of the war was in sight."], "answer": "B", "why": "Government campaigns framed the shift as <em>“both patriotic and temporary.”<\/em> “Temporary” shows the government saw women's work as a wartime measure.", "others": ["<b>A:<\/b> the passage never says the government doubted women's abilities.", "<b>C:<\/b> the opposite: the campaigns presented women's work as patriotic.", "<b>D:<\/b> no date of 1944 is mentioned. Women were dismissed when the war ended."]}, {"n": 4, "stem": "What is the nature of the debate among historians mentioned in the passage?", "options": ["Some historians emphasize the lasting effects of women's wartime employment, while others see it as a short-lived phenomenon.", "Some historians argue that the Second World War benefited women, while most historians point to the hardships experienced by women during the war.", "Some historians criticize women for participating in war industries, while others praise them for their patriotism and bravery.", "Some historians highlight the gains women achieved in the 1940s, while others stress the continuity of traditional gender roles during the war period."], "answer": "A", "why": "Paragraph 2 presents historians who see <em>“a lasting break with traditional gender roles”<\/em>; paragraph 3 presents those who <em>“stress the short-lived nature of the change.”<\/em>", "others": ["<b>B:<\/b> the debate is not about hardships during the war, and “most historians” is unsupported.", "<b>C:<\/b> no historian criticizes women.", "<b>D:<\/b> the second group focuses on what happened after the war, not on traditional roles during it."]}, {"n": 5, "stem": "The passage suggests that which of the following was a result of the end of the war?", "options": ["Women were shifted into different industries after defense contracts ended.", "Men replaced women in many industrial jobs.", "Women gladly gave up their jobs to return to their families.", "Employers lowered the pay of women."], "answer": "B", "why": "When the war ended, <em>“men returned home”<\/em> and <em>“women were often dismissed,”<\/em> so men took back the industrial jobs.", "others": ["<b>A:<\/b> the passage says women left the workforce, not that they moved to other industries.", "<b>C:<\/b> contradicts the passage. Women were <em>“encouraged—or required—to leave”<\/em>; nothing says they did so gladly.", "<b>D:<\/b> pay is not mentioned."]}]}, {"title": "Optical Astronomy", "offset": 0, "paras": ["Optical astronomy, the study of celestial objects through visible light, has been revolutionized by adaptive optics, first developed in the late 1980s. <span class=\"sq\">■ A<\/span> This technology, which allows ground-based telescopes at observatories to counteract atmospheric distortion, has enabled astronomers to observe the cosmos with exceptional clarity. Light waves from distant stars travel through Earth’s atmosphere, creating a shimmering effect that distorts them. <span class=\"sq\">■ B<\/span> Adaptive optics corrects these distortions in real time using a system of deformable mirrors controlled by computer algorithms. <span class=\"sq\">■ C<\/span> The mirrors can change shape rapidly to counteract the distortion, with the algorithms calculating the needed adjustments thousands of times per second. <span class=\"sq\">■ D<\/span>", "However, the technology is not without controversy. Some argue that the energy consumption of adaptive optics contributes significantly to observatories’ carbon footprints. Yet, proponents counter that the potential discoveries outweigh environmental concerns, citing recent breakthroughs in identifying exoplanets potentially hospitable to life.", "The debate highlights the complexities of balancing scientific advancement with environmental <mark>stewardship<\/mark>. Some researchers are actively exploring the use of solar panels and wind turbines to power these observatories, especially for daytime operations. Others are trying to <mark>optimize algorithms<\/mark> to reduce unnecessary computations and the need for constant high-speed corrections."], "questions": [{"n": 1, "stem": "What can be inferred from the passage about the capabilities of optical astronomy <u>before<\/u> the late 1980s?", "options": ["Images of celestial objects from ground-based telescopes were often unclear.", "Astronomers used adaptive optics to distort light waves.", "Astronomers used the shimmering effect to find distant stars.", "Telescopes used deformable mirrors to see farther into space."], "answer": "A", "why": "Adaptive optics, developed in the late 1980s, <em>“enabled astronomers to observe the cosmos with exceptional clarity”<\/em> by correcting atmospheric distortion. Before it, images were distorted by the shimmering effect.", "others": ["<b>B:<\/b> adaptive optics corrects distortion; it didn't exist before the late 1980s.", "<b>C:<\/b> the shimmering effect is a problem, not a tool.", "<b>D:<\/b> deformable mirrors are part of adaptive optics, so they came later."]}, {"n": 2, "stem": "How do proponents of adaptive optics counter criticism of the technology?", "options": ["The observatories that use the technology have a lower carbon footprint than the critics maintain.", "The usefulness of the technology is more important than its drawbacks.", "The technology is only in its early stages and will improve over time.", "The negative effects of the technology are localized and not globally significant."], "answer": "B", "why": "Proponents say <em>“the potential discoveries outweigh environmental concerns.”<\/em>", "others": ["<b>A:<\/b> they don't deny the carbon footprint.", "<b>C, D:<\/b> neither argument appears in the passage."]}, {"n": 3, "stem": "The word <mark>“stewardship”<\/mark> in the passage is closest in meaning to", "options": ["supervision", "achievement", "enthusiasm", "design"], "answer": "A", "why": "Environmental <mark>stewardship<\/mark> is the responsible care and management of the environment. Of the four options, “supervision” (overseeing and managing) is closest.", "others": []}, {"n": 4, "stem": "Why does the author mention attempts to <mark>optimize algorithms<\/mark>?", "options": ["To give an example of how observatories could cut costs", "To suggest that current algorithms still contain some errors when adjusting mirrors", "To provide an example of how adaptive optics continues to evolve", "To show one way researchers are trying to reduce observatories’ energy consumption"], "answer": "D", "why": "Paragraph 3 lists two responses to the energy debate: renewable power and <em>“optimize algorithms to reduce unnecessary computations.”<\/em> Fewer computations mean less energy.", "others": ["<b>A:<\/b> costs are not mentioned.", "<b>B:<\/b> nothing says the algorithms make errors.", "<b>C:<\/b> the paragraph is about the environmental debate, not about the technology's development in general."]}, {"n": 5, "stem": "There are four locations [■] in the passage that indicate where the following sentence could be added.<br><br><em>To understand this phenomenon, imagine looking through the heat waves seen over hot asphalt or desert sand.<\/em><br><br>Where would the sentence best fit?", "options": ["Location A", "Location B", "Location C", "Location D"], "answer": "B", "why": "“This phenomenon” must refer back to <em>“a shimmering effect that distorts them,”<\/em> which comes right before B. Heat waves over asphalt are an everyday example of the same shimmering.", "others": ["<b>A:<\/b> the shimmering effect hasn't been mentioned yet.", "<b>C, D:<\/b> the sentence would interrupt the explanation of how the mirrors correct the distortion."]}]}, {"title": "Thermodynamics and Ecosystems", "offset": 0, "paras": ["When students first encounter the laws of thermodynamics, educators often rely on simplified analogies—billiard balls, falling stones—to convey foundational principles. Yet these laws extend far beyond mechanical systems, offering a powerful framework for interpreting complex phenomena such as energy flow in ecosystems. The first law, which asserts that energy cannot be created or destroyed but only transformed, is clearly exemplified in nature: <mark>sunlight becomes chemical energy<\/mark> via photosynthesis, which fuels plants, then herbivores and, ultimately, carnivores. This cascading energy transfer underscores the conservation principle while revealing the intricate interdependence among trophic (food chain) levels, with each organism depending on the energy efficiency of those occupying the level below.", "In contrast, the second law—which states that entropy, or disorder, tends to increase—illuminates why ecosystems evolve toward less efficient energy use. While simple organisms at the base of the food chain convert energy with relative efficiency, larger animals lose much of their energy intake. This <mark>disparity<\/mark> is not merely a biological curiosity; it reflects a fundamental thermodynamic constraint. As ecosystems mature, energy becomes increasingly fragmented and less available for productive work. Exceptions exist—some top predators exhibit surprising metabolic efficiency—but the general trend remains: Complexity breeds energy loss."], "questions": [{"n": 1, "stem": "Identify the sentence in paragraph 1 that introduces the idea that thermodynamics has implications that the reader may not expect.", "options": ["When students first encounter the laws of thermodynamics, educators often rely on simplified analogies—billiard balls, falling stones—to convey foundational principles.", "Yet these laws extend far beyond mechanical systems, offering a powerful framework for interpreting complex phenomena such as energy flow in ecosystems.", "The first law, which asserts that energy cannot be created or destroyed but only transformed, is clearly exemplified in nature: sunlight becomes chemical energy via photosynthesis, which fuels plants, then herbivores and, ultimately, carnivores.", "This cascading energy transfer underscores the conservation principle while revealing the intricate interdependence among trophic (food chain) levels, with each organism depending on the energy efficiency of those occupying the level below."], "answer": "B", "why": "The signal word <em>“Yet”<\/em> contrasts the simple classroom analogies with the surprising reach of thermodynamics: it also explains <em>“energy flow in ecosystems.”<\/em>", "others": ["<b>A:<\/b> describes how thermodynamics is usually taught, which the reader would expect.", "<b>C, D:<\/b> develop the idea with an example; they don't introduce it."]}, {"n": 2, "stem": "Why does the author note that <mark>“sunlight becomes chemical energy”<\/mark>?", "options": ["To illustrate the claim that educators rely on simple analogies when teaching thermodynamics", "To challenge the idea that thermodynamics offers a way of understanding complex phenomena", "To provide an example of increasing entropy in a biological system", "To show how the first law of thermodynamics is applicable to food chains"], "answer": "D", "why": "The first law is <em>“clearly exemplified in nature”<\/em>: energy passes from sunlight to plants, herbivores and carnivores, changing form but never disappearing.", "others": ["<b>A:<\/b> the classroom analogies are billiard balls and falling stones.", "<b>B:<\/b> the example supports that idea; it doesn't challenge it.", "<b>C:<\/b> entropy belongs to the second law, discussed in paragraph 2."]}, {"n": 3, "stem": "According to the passage, what principle explains the trend toward less efficient energy use in ecosystems?", "options": ["Smaller systems tend to combine into larger ones.", "As entropy increases, less energy is available for work.", "Energy is never lost but takes on many different forms.", "Top predators are vulnerable to changes in an ecosystem."], "answer": "B", "why": "The second law <em>“illuminates why ecosystems evolve toward less efficient energy use”<\/em>, and as ecosystems mature, energy becomes <em>“less available for productive work.”<\/em>", "others": ["<b>A, D:<\/b> not stated in the passage.", "<b>C:<\/b> this is the first law; it doesn't explain the loss of efficiency."]}, {"n": 4, "stem": "The word <mark>“disparity”<\/mark> in the passage is closest in meaning to", "options": ["tendency", "difference", "comparison", "conclusion"], "answer": "B", "why": "The <mark>disparity<\/mark> is the gap between simple organisms, which convert energy efficiently, and larger animals, which lose much of theirs.", "others": ["<b>C:<\/b> a comparison is how you notice a difference; it isn't the difference itself."]}, {"n": 5, "stem": "What does the passage suggest about top predators?", "options": ["They are the most complex organisms in an ecosystem.", "They are metabolically more efficient than their prey.", "Their metabolic efficiency depends on their habitat.", "They use up their energy more slowly as they mature."], "answer": "B", "why": "Larger animals usually lose much of their energy intake, yet <em>“some top predators exhibit surprising metabolic efficiency.”<\/em> They are an exception to the trend that efficiency drops up the food chain.", "others": ["<b>A:<\/b> “complexity” in the passage describes maturing ecosystems, not individual organisms.", "<b>C, D:<\/b> habitat and maturing predators are not mentioned.", "<b>Note:<\/b> the passage says <i>some<\/i> top predators, while B generalizes to all of them. B is the best option, but expect questions about this item."]}]}, {"title": "The Effects of Urbanization on Bird Populations", "offset": 0, "paras": ["Urbanization has had a profound impact on bird populations worldwide. As cities expand, natural habitats are replaced with buildings, roads, and other infrastructure. This leads to a significant reduction in the availability of nesting sites and food sources for birds.", "Some species, such as <mark>pigeons and sparrows<\/mark>, have adapted well to urban environments, taking advantage of the new resources and structures. However, many other species struggle to survive in these altered landscapes. Therefore, it is imperative to find solutions that help birds adapt to city life. One notable effect of urbanization is the change in bird song. Birds living in cities often sing at higher pitches and volumes than their rural counterparts. This adaptation helps them communicate over the noise of traffic and human activity. Additionally, the artificial lighting in cities can disrupt the natural circadian (daily time-related) rhythms of birds, affecting their breeding and feeding behaviors.", "Conservationists are working to <mark>mitigate<\/mark> the negative effects of urbanization on birds. Initiatives such as creating urban green spaces, constructing bird-friendly buildings, and reducing light pollution are being implemented. These efforts aim to create a more hospitable environment for birds, allowing them to coexist with humans in urban settings."], "questions": [{"n": 1, "stem": "The word <mark>“mitigate”<\/mark> in the passage is closest in meaning to", "options": ["understand", "analyze", "communicate", "reduce"], "answer": "D", "why": "Conservationists want to <mark>mitigate<\/mark>, or lessen, <em>“the negative effects of urbanization.”<\/em> The initiatives that follow all aim to make those effects smaller.", "others": []}, {"n": 2, "stem": "Which of the following is <u>not<\/u> mentioned as an effect of urbanization on birds in the passage?", "options": ["Reduced availability of nesting sites", "Changes in bird song", "Increased food sources", "Disrupted circadian rhythms"], "answer": "C", "why": "The passage says the opposite: urbanization causes <em>“a significant reduction in the availability of nesting sites and food sources.”<\/em>", "others": ["<b>A:<\/b> paragraph 1, “reduction in the availability of nesting sites.”", "<b>B:<\/b> paragraph 2, “the change in bird song.”", "<b>D:<\/b> paragraph 2, lighting “can disrupt the natural circadian… rhythms.”", "<b>Watch out:<\/b> pigeons and sparrows use “new resources,” but that applies to a few species and is not an increase in food overall."]}, {"n": 3, "stem": "Why does the author mention <mark>pigeons and sparrows<\/mark>?", "options": ["To identify birds that struggle to survive in urban environments", "To give examples of birds that have adjusted to living in urban settings", "To highlight the diversity of urban bird species", "To suggest that all birds can adapt to cities"], "answer": "B", "why": "The author introduces them as species that <em>“have adapted well to urban environments.”<\/em>", "others": ["<b>A:<\/b> the opposite. Struggling species are mentioned in the next sentence.", "<b>C:<\/b> diversity is not the point.", "<b>D:<\/b> the passage says <em>“many other species struggle,”<\/em> so not all birds adapt."]}, {"n": 4, "stem": "What is one initiative mentioned in the passage to help birds in urban areas?", "options": ["Introducing new bird species to urban areas", "Providing human-made food sources to birds", "Creating urban green spaces", "Decreasing the amount of noise made by traffic"], "answer": "C", "why": "Paragraph 3 lists three initiatives: <em>“creating urban green spaces, constructing bird-friendly buildings, and reducing light pollution.”<\/em>", "others": ["<b>D:<\/b> traffic noise is mentioned in connection with bird song, but reducing it is not listed as an initiative.", "<b>A, B:<\/b> not mentioned."]}, {"n": 5, "stem": "What can be inferred about the impact artificial lighting in cities has on birds?", "options": ["It disrupts the natural behaviors of birds.", "It allows birds to find food at night.", "It helps birds to adapt to urban environments.", "It increases the population of urban birds."], "answer": "A", "why": "Artificial lighting <em>“can disrupt the natural circadian… rhythms of birds, affecting their breeding and feeding behaviors.”<\/em>", "others": ["<b>B, C, D:<\/b> lighting is presented only as a problem, and conservationists work to reduce light pollution.", "<b>Note:<\/b> the question says “inferred,” but A is stated almost word for word in the passage."]}]}, {"title": "Mysterious Viking Sunstones", "offset": 10, "paras": ["The Vikings, seafaring warriors from Scandinavia, are believed to have navigated their ships with remarkable precision across the North Atlantic during the medieval period (about 500–1500 C.E.). <span class=\"sq\">■ A<\/span> One key to their navigational success may have been the use of so-called “sunstones,” as described in Icelandic sagas (medieval Icelandic texts). Some argue the sagas’ content is mythical, while others suggest these stones were real tools used by the Vikings, probably crystals, such as Iceland spar.", "Iceland spar is a transparent variety of calcite that possesses unique optical properties. <span class=\"sq\">■ B<\/span> It polarizes light by splitting light into two beams, creating a double image when the stone is held up to the sky. By rotating the crystal, the Vikings could determine the location of the sun in the sky on cloudy days, which would help them maintain their course. <span class=\"sq\">■ C<\/span> However, evidence of actual sunstone use remains scarce.", "Archaeologists have yet to uncover these stones in the remains of Viking settlements or ships. But an Iceland spar sunstone was recovered from <mark>a ship that sank in 1592<\/mark>, suggesting that this navigational tool was indeed used for quite some time. <span class=\"sq\">■ D<\/span> The theoretical use of sunstones remains a fascinating example of Viking <mark>ingenuity<\/mark>."], "questions": [{"n": 11, "stem": "Why does debate continue about the sunstones mentioned in Icelandic sagas?", "options": ["The sagas describe other uses for sunstones.", "Archaeologists have not found any such stones when examining Viking sites.", "Research indicates that sunstones are not actually an effective navigation tool.", "Researchers suspect that sunstones were not easy to obtain in the medieval period."], "answer": "B", "why": "Evidence <em>“remains scarce”<\/em>: archaeologists <em>“have yet to uncover these stones in the remains of Viking settlements or ships.”<\/em>", "others": ["<b>A, D:<\/b> not mentioned.", "<b>C:<\/b> the passage explains how the stones could work; it never says they were ineffective."]}, {"n": 12, "stem": "In what way was Iceland spar useful to Vikings?", "options": ["It helped them predict when clouds would disappear.", "It was used as a tool to help maintain ships.", "It helped them figure out where the sun was when it could not be seen.", "It was used to improve seafarers’ vision."], "answer": "C", "why": "By rotating the crystal, Vikings <em>“could determine the location of the sun in the sky on cloudy days.”<\/em>", "others": ["<b>A:<\/b> it located the sun behind clouds; it didn't predict the weather.", "<b>B:<\/b> “maintain their course” is about direction, not ship repair. A tempting trap with the word “maintain.”", "<b>D:<\/b> it created a double image of the sky; it didn't improve eyesight."]}, {"n": 13, "stem": "Why does the author mention <mark>a ship that sank in 1592<\/mark>?", "options": ["To explain how Elizabethans refined a technology invented by Vikings", "To support the theory that Vikings used Iceland spar for navigation", "To give an example of a more modern navigational tool", "To provide information about archaeological methods"], "answer": "B", "why": "Since no stones have been found at Viking sites, the 1592 find is the only physical evidence that Iceland spar was used for navigation, <em>“suggesting that this navigational tool was indeed used for quite some time.”<\/em>", "others": ["<b>A:<\/b> the passage never mentions Elizabethans or any improvement to the technology.", "<b>C:<\/b> the stone was the same kind of tool, not a more modern one.", "<b>D:<\/b> archaeological methods are not discussed."]}, {"n": 14, "stem": "The word <mark>“ingenuity”<\/mark> in the passage is closest in meaning to", "options": ["education", "cleverness", "luck", "fame"], "answer": "B", "why": "<mark>Ingenuity<\/mark> is the quality of being inventive and clever. Using a crystal to find a hidden sun is an example of it.", "others": []}, {"n": 15, "stem": "There are four locations [■] in the passage that indicate where the following sentence could be added.<br><br><em>This is all the more remarkable considering the lack of technology at the time.<\/em><br><br>Where would the sentence best fit?", "options": ["Location A", "Location B", "Location C", "Location D"], "answer": "A", "why": "“This is all the more remarkable” must follow something remarkable: the Vikings navigated <em>“with remarkable precision”<\/em> in the medieval period. “The lack of technology at the time” links to “medieval.”", "others": ["<b>B, C:<\/b> the sentence would break the explanation of how Iceland spar works.", "<b>D:<\/b> follows a point about a ship from 1592, not about Viking skill."]}]}, {"title": "Understanding Ecological Systems Theory", "offset": 0, "paras": ["Ecological Systems Theory, introduced by Urie Bronfenbrenner, revolutionized our perception of human psychological development. <span class=\"sq\">■ A<\/span> It posits that individuals are shaped by interactions among multiple overlapping environmental systems. <span class=\"sq\">■ B<\/span> This theory reshaped developmental research, offering a multi-faceted lens that surpasses earlier, linear models. <span class=\"sq\">■ C<\/span> By considering the dynamic interplay between a person and their environment, it highlights the multifactorial nature of psychological growth. <span class=\"sq\">■ D<\/span>", "The theory delineates several environmental layers, beginning with the microsystem, which refers to the institutions and groups that most directly impact the child’s development, such as family and school. The mesosystem encompasses the relationships among the microsystems, such as the impact of <mark>a teacher’s communication with parents<\/mark> on a child’s education. Beyond these, the exosystem consists of indirect influences like a parent’s workplace stress <mark>subtly affecting<\/mark> the home environment. The macrosystem, encompassing broader cultural and societal contexts, frames these interactions with underlying norms and policies.", "While Bronfenbrenner’s model offers an intricate framework, it is not without critique. Some argue that the model underestimates the role of technology, which has created virtual microsystems that transcend geographical limits. Despite these critiques, the theory remains influential in fields ranging from education to public policy, prompting continuous exploration of its implications."], "questions": [{"n": 1, "stem": "The passage suggests that criticisms of Bronfenbrenner’s model call for which of the following?", "options": ["Its replacement with a less intricate framework", "Its modification to include virtual interactions", "Its replacement with a model that gives greater consideration to geographical boundaries", "Its exclusion from fields such as education and public policy"], "answer": "B", "why": "Critics say the model <em>“underestimates the role of technology, which has created virtual microsystems.”<\/em> The fix is to add those virtual interactions, not to throw the model away.", "others": ["<b>A:<\/b> no one asks for a simpler framework.", "<b>C:<\/b> the opposite. Virtual microsystems <em>“transcend geographical limits.”<\/em>", "<b>D:<\/b> the theory <em>“remains influential”<\/em> in those fields."]}, {"n": 2, "stem": "The phrase <mark>“subtly affecting”<\/mark> in the passage is closest in meaning to", "options": ["affecting in harmless but unpredictable ways", "affecting in long-lasting ways", "affecting in ways both positive and negative", "affecting in small, barely noticeable ways"], "answer": "D", "why": "Something that happens <mark>subtly<\/mark> is quiet and hard to notice. A parent’s stress at work slowly changes the mood at home.", "others": ["<b>A, B, C:<\/b> the passage says nothing about the effect being harmless, lasting, or both positive and negative."]}, {"n": 3, "stem": "Why does the author mention <mark>“a teacher’s communication with parents”<\/mark> in paragraph 2?", "options": ["To illustrate the interactions among microsystems that characterize the mesosystem", "To support the claim that the institutions of the microsystem affect children directly", "To show that Bronfenbrenner’s theory is primarily linear", "To suggest that microsystems are more important than the mesosystem"], "answer": "A", "why": "The mesosystem <em>“encompasses the relationships among the microsystems”<\/em>. Teachers (school) and parents (family) belong to two different microsystems, and their communication is one such relationship.", "others": ["<b>B:<\/b> the example is about the mesosystem, not the microsystem.", "<b>C:<\/b> the theory <em>“surpasses earlier, linear models.”<\/em>", "<b>D:<\/b> the passage never ranks the systems by importance."]}, {"n": 4, "stem": "Which of the following best describes the influence of Ecological Systems Theory?", "options": ["It has had little impact on psychology but has unexpectedly affected other fields.", "It revolutionized the field of human psychology but is not taken seriously in other fields.", "It changed the way human psychology is understood and continues to influence other fields.", "It has gone mostly unnoticed among psychologists and has had little impact on other fields."], "answer": "C", "why": "The theory <em>“revolutionized our perception of human psychological development”<\/em> and <em>“remains influential in fields ranging from education to public policy.”<\/em>", "others": ["<b>A, D:<\/b> contradict “revolutionized.”", "<b>B:<\/b> contradicts “remains influential” in education and public policy."]}, {"n": 5, "stem": "There are four locations [■] in the passage that indicate where the following sentence could be added.<br><br><em>Each one plays a distinct role in shaping behavior.<\/em><br><br>Where would the sentence best fit?", "options": ["Location A", "Location B", "Location C", "Location D"], "answer": "B", "why": "“Each one” needs a plural noun to refer back to: <em>“multiple overlapping environmental systems,”<\/em> which comes right before B. The sentence also prepares for paragraph 2, which describes each system’s role.", "others": ["<b>A:<\/b> nothing plural yet for “each one” to refer to.", "<b>C, D:<\/b> “each one” would seem to refer to “earlier, linear models” or to nothing at all."]}]}, {"title": "Cybernetic Prosthetics", "offset": 0, "paras": ["Cybernetic prosthetics have revolutionized medical technology, offering hope to individuals who have lost limbs. Unlike traditional prosthetics, which are often cumbersome and limited in function, cybernetic versions are designed to integrate <mark>seamlessly<\/mark> with the human nervous system. This integration allows for more natural movement and even sensation. A key development in this field has been the use of myoelectric sensors, which detect electrical signals generated by muscle movements.", "One example is a cybernetic hand that can perform delicate tasks such as picking up small objects or typing. This is achieved through advanced algorithms that translate muscle signals into controlled movements. Researchers are also exploring haptic feedback, which would enable users to feel textures and temperatures through their prosthetic limbs. It involves integrating sensors and actuators that mimic the sensation of touch by stimulating the user’s nerve endings or skin with electrical signals. This could significantly improve the quality of life for amputees.", "<span class=\"sq\">■ A<\/span> The high cost of these prosthetics makes them inaccessible to many. <span class=\"sq\">■ B<\/span> Additionally, the technology requires regular maintenance and updates, which can be a barrier. <span class=\"sq\">■ C<\/span> Current battery life is another limitation, as it restricts the user’s ability to wear the prosthetic for extended periods. <span class=\"sq\">■ D<\/span> Researchers are continually working to make these devices more affordable and user-friendly."], "questions": [{"n": 1, "stem": "The word <mark>“seamlessly”<\/mark> in the passage is closest in meaning to", "options": ["generally", "smoothly", "repeatedly", "slowly"], "answer": "B", "why": "To integrate <mark>seamlessly<\/mark> means to fit together smoothly, with no visible joins, like fabric without seams. It contrasts with traditional prosthetics, which are <em>“cumbersome.”<\/em>", "others": []}, {"n": 2, "stem": "What can be inferred about myoelectric sensors?", "options": ["They function less effectively in mechanical prosthetics.", "They rely less on electric signals than other types of sensors.", "They allow for more natural movement in cybernetic prosthetics.", "They make cybernetic prosthetics somewhat cumbersome."], "answer": "C", "why": "Integration with the nervous system <em>“allows for more natural movement,”<\/em> and myoelectric sensors are <em>“a key development”<\/em> that make this integration possible by reading muscle signals.", "others": ["<b>A:<\/b> mechanical prosthetics are not discussed.", "<b>B:<\/b> the opposite. They detect electrical signals.", "<b>D:<\/b> “cumbersome” describes traditional prosthetics."]}, {"n": 3, "stem": "What does the passage indicate about cybernetic hands?", "options": ["They are very similar in appearance to natural human limbs.", "They are currently limited in their range of motion.", "They rely on algorithms that turn muscle signals into movements.", "They can cause skin irritation if worn for extended periods."], "answer": "C", "why": "Delicate tasks are possible <em>“through advanced algorithms that translate muscle signals into controlled movements.”<\/em>", "others": ["<b>A, D:<\/b> appearance and skin irritation are not mentioned.", "<b>B:<\/b> the opposite. They can do delicate tasks like typing."]}, {"n": 4, "stem": "According to the passage, using haptic feedback in artificial limbs can result in all of the following <u>except<\/u>", "options": ["detecting electrical signals from muscles", "changing the temperature of objects", "simulating touch and nerve endings", "integrating sensors and actuators"], "answer": "B", "why": "Haptic feedback lets users <em>“feel”<\/em> temperatures. It doesn't change the temperature of anything.", "others": ["<b>Note:<\/b> this item is flawed. <b>A<\/b> (detecting muscle signals) is what myoelectric sensors do, not haptic feedback, so it is also technically not a result of haptic feedback. <b>C<\/b> and <b>D<\/b> describe how haptic feedback works rather than its results. B is the intended answer, but expect students to argue for A."]}, {"n": 5, "stem": "There are four locations [■] in the passage that indicate where the following sentence could be added.<br><br><em>To take full advantage of these amazing new technologies, a few obstacles need to be overcome.<\/em><br><br>Where would the sentence best fit?", "options": ["Location A", "Location B", "Location C", "Location D"], "answer": "A", "why": "The sentence introduces the problems. Paragraph 3 then lists them: high cost, maintenance, and battery life. <em>“These amazing new technologies”<\/em> refers back to the advances in paragraphs 1–2.", "others": ["<b>B, C, D:<\/b> the list of obstacles has already started, so an introduction would come too late."]}]}, {"title": "Ancient Egyptian Medicine", "offset": 15, "paras": ["Ancient Egyptian medicine was advanced for its time and laid the foundation for many modern practices. Egyptians believed the body was a system of channels similar to the Nile River. Illness was thought to be caused by blockages in these channels, like <mark>a blocked canal causing flooding<\/mark>. Treatments focused on unblocking channels using herbal remedies and physical interventions. One significant contribution of Egyptian medicine was surgical techniques. Ancient texts describe procedures like the removal of tumors and the setting of broken bones. They also record practices like cleaning wounds and disinfecting medical instruments. This suggests that Egyptian doctors understood the connection between cleanliness and preventing infections, a concept widely accepted only much later in history. In addition to surgery, Egyptians were skilled in pharmacology. They used substances like honey and <mark>willow bark<\/mark> to treat ailments. Modern science has validated some ancient remedies; for example, willow bark contains salicin, a precursor to aspirin, with pain-relieving properties. While Egyptians demonstrated an impressive body of knowledge, Egyptian medicine was also intertwined with religion. Many treatments involved prayers and rituals to <mark>invoke<\/mark> the favor of the gods. This blend of empirical practice and spiritual belief shows the complexity of ancient Egyptian medicine."], "questions": [{"n": 16, "stem": "The author mentions <mark>“a blocked canal causing flooding”<\/mark> to explain", "options": ["the importance of the Nile River for Egyptian culture", "the ancient Egyptians’ idea of why humans became sick", "the wide variety of illnesses common in ancient Egypt", "the connection between agriculture and medicine"], "answer": "B", "why": "<em>“Illness was thought to be caused by blockages in these channels,”<\/em> and the blocked canal is a comparison that makes this belief easy to picture.", "others": ["<b>A, D:<\/b> the Nile is used only as a comparison; the passage doesn't discuss its cultural role or farming.", "<b>C:<\/b> no specific illnesses are listed."]}, {"n": 17, "stem": "The passage suggests that which of the following was a surprising achievement of ancient Egyptian medicine?", "options": ["Its procedures improved greatly over time.", "It understood the importance of cleanliness in preventing infections.", "Its use of Nile River water was often successful.", "Its understanding of the cause of illnesses was largely accurate."], "answer": "B", "why": "Cleaning wounds and disinfecting instruments show that doctors <em>“understood the connection between cleanliness and preventing infections, a concept widely accepted only much later in history.”<\/em> “Only much later” is what makes it surprising.", "others": ["<b>A:<\/b> the passage doesn't trace changes over time.", "<b>C:<\/b> Nile water is never mentioned as a treatment.", "<b>D:<\/b> the passage presents the “blocked channels” idea as a belief, not as accurate science."]}, {"n": 18, "stem": "Why does the author discuss the use of <mark>willow bark<\/mark>?", "options": ["To suggest that some ancient remedies could be harmful", "To explain the invention of aspirin", "To highlight the variety of natural remedies available in Egypt", "To show that some ancient Egyptian remedies were effective"], "answer": "D", "why": "Willow bark is the example after <em>“Modern science has validated some ancient remedies”<\/em>: it contains salicin, which relieves pain.", "others": ["<b>A:<\/b> the opposite.", "<b>B:<\/b> aspirin is mentioned only to explain why the remedy worked.", "<b>C:<\/b> one example doesn't show variety, and the sentence is about effectiveness."]}, {"n": 19, "stem": "The word <mark>“invoke”<\/mark> in the passage is closest in meaning to", "options": ["request", "understand", "increase", "express"], "answer": "A", "why": "To <mark>invoke<\/mark> the favor of the gods is to call on them and ask for their help.", "others": ["<b>D:<\/b> people expressed their faith, but the prayers asked for something."]}, {"n": 20, "stem": "What role did religion play in ancient Egyptian medicine?", "options": ["Doctors were trained by religious authorities.", "Religious beliefs limited the kinds of medicine that could be used.", "Prayers and rituals were often a part of medical treatment.", "Doctors were thought to have special connections to the gods."], "answer": "C", "why": "<em>“Many treatments involved prayers and rituals to invoke the favor of the gods.”<\/em>", "others": ["<b>A, B, D:<\/b> the training of doctors, limits on medicine and doctors’ connection to the gods are not mentioned."]}]}, {"title": "Wind Ensemble Conducting", "offset": 10, "paras": ["In the world of classical music, wind ensemble conducting requires a blend of artistry and precision, demanding a conductor who can shape diverse musicians into a <mark>cohesive<\/mark> unit. <span class=\"sq\">■ A<\/span> Unlike orchestral conductors, who often lead ensembles centered around strings, wind ensemble conductors primarily work with woodwinds, brass, and percussion, requiring a different set of interpretive and technical skills. <span class=\"sq\">■ B<\/span>", "One challenge of wind ensemble conducting is balancing the ensemble. <span class=\"sq\">■ C<\/span> Wind instruments produce a wide range of dynamics and timbres, making it essential for conductors to ensure that no single section overpowers the others. <span class=\"sq\">■ D<\/span> For example, the brassy sound of trumpets can dominate if not carefully managed. Conductors must use gestures and cues to achieve balance, considering the acoustics of the performance space.", "Interpreting the score is another crucial aspect. Wind ensemble pieces often include compositions from modern and contemporary composers, which can be complex and unconventional. Conductors need to interpret these scores carefully and convey their vision to the musicians. This involves precise beat patterns and expressive gestures to communicate dynamic contrasts and phrasing.", "Wind ensemble conductors collaborate closely with composers, which can lead to unique performances that reflect the composer’s original intent. Conductors may need to adjust their style to suit different compositions and settings."], "questions": [{"n": 11, "stem": "The word <mark>“cohesive”<\/mark> in the passage is closest in meaning to", "options": ["integrated", "outstanding", "proficient", "performing"], "answer": "A", "why": "A <mark>cohesive<\/mark> unit is one whose parts are joined into a whole. The conductor turns <em>“diverse musicians”<\/em> into one unified group.", "others": ["<b>B, C:<\/b> “outstanding” and “proficient” describe quality or skill, not unity.", "<b>D:<\/b> “performing” describes an activity."]}, {"n": 12, "stem": "According to the passage, balancing the ensemble is a challenge for wind ensemble conductors because", "options": ["woodwind sections typically need more rehearsal time than brass sections do", "wind instruments create a wide variety of sound qualities and volume levels", "the cues and gestures used by wind ensemble conductors are limited", "most performance spaces have poor acoustics"], "answer": "B", "why": "Wind instruments <em>“produce a wide range of dynamics and timbres.”<\/em> Dynamics are volume levels, and timbres are sound qualities.", "others": ["<b>A:<\/b> rehearsal time is not mentioned.", "<b>C:<\/b> gestures and cues are how conductors solve the problem.", "<b>D:<\/b> conductors consider acoustics, but the passage never says most spaces are poor."]}, {"n": 13, "stem": "What is the main purpose of paragraph 3?", "options": ["To highlight the role of composers in wind ensemble conducting", "To discuss the history of wind ensemble music", "To explore the challenges of working with complex modern compositions", "To describe the physical techniques used by conductors"], "answer": "C", "why": "Paragraph 3 is about interpreting scores by contemporary composers, <em>“which can be complex and unconventional.”<\/em>", "others": ["<b>A:<\/b> composers are the focus of paragraph 4.", "<b>B:<\/b> the history of wind music is not discussed.", "<b>D:<\/b> beat patterns and gestures are mentioned, but only as a detail supporting the main point."]}, {"n": 14, "stem": "What can be inferred about wind ensemble conductors’ collaboration with composers?", "options": ["It often leads to arguments.", "It leads to greater uniformity in performances.", "It is strictly professional and reserved in tone.", "It requires flexibility and openness to new ideas."], "answer": "D", "why": "Collaboration leads to <em>“unique performances,”<\/em> and conductors <em>“may need to adjust their style to suit different compositions and settings.”<\/em> Adjusting your style requires flexibility.", "others": ["<b>A, C:<\/b> the tone of the collaboration is not described.", "<b>B:<\/b> the opposite. The performances are “unique.”"]}, {"n": 15, "stem": "There are four locations [■] in the passage that indicate where the following sentence could be added.<br><br><em>In light of their area of expertise, wind ensemble conductors face a unique set of difficulties.<\/em><br><br>Where would the sentence best fit?", "options": ["Location A", "Location B", "Location C", "Location D"], "answer": "B", "why": "The sentence links the two paragraphs. <em>“Their area of expertise”<\/em> refers back to woodwinds, brass and percussion, and <em>“a unique set of difficulties”<\/em> introduces paragraph 2, which begins <em>“One challenge…”<\/em>", "others": ["<b>A:<\/b> comes before the area of expertise has been described.", "<b>C, D:<\/b> the discussion of challenges has already started, so an introduction would come too late."]}]}, {"title": "The Shifting Art of Playwriting", "offset": 10, "paras": ["Innovative playwriting techniques have transformed the theatrical landscape by challenging linear storytelling and passive spectatorship. Nonlinear narratives, seen in plays like Harold Pinter’s <i>Betrayal<\/i>, disrupt chronological order to reflect the fragmented nature of memory and emotion. This structure invites audiences to actively reconstruct the story, deepening their engagement.", "Another innovation is the so-called breaking of the fourth wall, where characters directly address the audience. Used by Bertolt Brecht in <mark><i>Mother Courage and Her Children<\/i><\/mark>, this technique encourages viewers to reflect critically rather than become absorbed in illusion. Fully interactive theater, exemplified by the British production <mark><i>Sleep No More<\/i><\/mark>, goes further by allowing viewers to physically move through the performance space, personalizing the experience and making each viewing unique.", "These techniques suggest a broader hypothesis that theatrical form is not merely a container for content but a vital part of creating meaning. By reshaping narrative structure and audience dynamics, playwrights can <mark>evoke<\/mark> new emotional and intellectual responses, revealing complex aspects of the human condition.", "Of course, such innovations may confuse rather than enlighten more traditional-minded theater audiences and also disrupt their emotional immersion, and fragment the narrative. Thus, while these techniques can serve as powerful tools, their success depends on thoughtful execution and a clear artistic purpose."], "questions": [{"n": 11, "stem": "What is the passage mainly about?", "options": ["The influence of traditional theater on modern audiences", "The role of audience participation in theatrical performances", "New approaches to theatrical storytelling and audience involvement", "The challenges of interpreting nonlinear narratives in drama"], "answer": "C", "why": "The passage covers innovations in storytelling (nonlinear narratives) and in the audience’s role (the fourth wall, interactive theater), then what they mean and their limits.", "others": ["<b>A:<\/b> the passage is about breaking with tradition.", "<b>B:<\/b> too narrow. Audience participation is only one of the techniques.", "<b>D:<\/b> too narrow. Nonlinear narratives appear only in paragraph 1."]}, {"n": 12, "stem": "According to the passage, what is a key difference between <mark><i>Mother Courage and Her Children<\/i><\/mark> and <mark><i>Sleep No More<\/i><\/mark>?", "options": ["<i>Mother Courage and Her Children<\/i> uses audience interaction to create emotional immersion, while <i>Sleep No More<\/i> avoids direct engagement.", "<i>Mother Courage and Her Children<\/i> involves some interaction with the audience, while <i>Sleep No More<\/i> involves actual audience participation.", "<i>Mother Courage and Her Children<\/i> presents a fragmented narrative, while <i>Sleep No More<\/i> follows a linear storyline.", "<i>Mother Courage and Her Children<\/i> is based on historical events, while <i>Sleep No More<\/i> is entirely fictional."], "answer": "B", "why": "In Brecht’s play, <em>“characters directly address the audience.”<\/em> <i>Sleep No More<\/i> <em>“goes further by allowing viewers to physically move through the performance space.”<\/em>", "others": ["<b>A:<\/b> the opposite. Brecht’s technique works against immersion: viewers should <em>“reflect critically rather than become absorbed in illusion.”<\/em>", "<b>C:<\/b> the fragmented narrative belongs to Pinter’s <i>Betrayal<\/i>.", "<b>D:<\/b> historical events and fiction are not mentioned."]}, {"n": 13, "stem": "Which of the following best describes the function of paragraph 3 in the passage?", "options": ["It offers a conjecture about what new playwriting techniques mean for theater.", "It summarizes the historical development of experimental theater techniques.", "It critiques the effectiveness of audience-centered performance styles.", "It introduces a counterargument to the use of nonlinear narratives in drama."], "answer": "A", "why": "The paragraph begins <em>“These techniques suggest a broader hypothesis.”<\/em> A hypothesis is a conjecture, and it is about form being <em>“a vital part of creating meaning.”<\/em>", "others": ["<b>B:<\/b> there is no history of the techniques.", "<b>C, D:<\/b> criticism and counterarguments come in paragraph 4."]}, {"n": 14, "stem": "The word <mark>“evoke”<\/mark> in the passage is closest in meaning to", "options": ["measure", "produce", "compare", "anticipate"], "answer": "B", "why": "To <mark>evoke<\/mark> a response is to bring it out, to cause or produce it.", "others": ["<b>D:<\/b> to anticipate a response is to expect it, not to cause it."]}, {"n": 15, "stem": "The passage introduces all of the following innovative approaches to playwriting <u>except<\/u>", "options": ["presenting events out of order", "actors speaking to audiences", "viewers walking onto the stage", "playwrights joining the cast"], "answer": "D", "why": "The passage never mentions playwrights performing in their own plays.", "others": ["<b>A:<\/b> nonlinear narratives <em>“disrupt chronological order.”<\/em>", "<b>B:<\/b> breaking the fourth wall: <em>“characters directly address the audience.”<\/em>", "<b>C:<\/b> interactive theater: viewers <em>“physically move through the performance space.”<\/em>"]}]}, {"title": "Smart Textiles", "offset": 25, "paras": ["Smart textiles are revolutionizing the fashion industry by integrating advanced digital technology into fabrics. These textiles can respond to environmental changes, monitor physical activity, and even generate energy. One example is phase-change materials that adapt to temperature fluctuations, providing warmth when it’s cold and cooling when it’s hot. Another innovation is textiles embedded with sensors that track health metrics, such as heart rate and body temperature. These developments offer promising applications for athletes and medical patients.", "Researchers are also exploring textiles that <mark>harvest<\/mark> energy from movement. These fabrics utilize piezoelectric materials that generate electricity when subjected to mechanical stress. <span class=\"sq\">■ A<\/span> Envision clothing that can charge your smartphone simply through your daily activities. <span class=\"sq\">■ B<\/span> Moreover, smart textiles can be designed to change color or pattern based on electrical stimuli, opening up new possibilities for both fashion and interior design. <span class=\"sq\">■ C<\/span>", "Yet, integrating technology into textiles presents challenges. <span class=\"sq\">■ D<\/span> Durability, washability, and cost are significant concerns. Since their initial cost will be higher than traditional fabrics, ensuring that smart textiles can withstand regular use without degrading is essential for their widespread adoption. Protecting privacy is another concern of many; smart textiles could collect vast amounts of user data that must be properly secured."], "questions": [{"n": 26, "stem": "What are phase-change materials designed to do?", "options": ["Generate electricity from movement", "Adapt to changes in temperature", "Monitor heart rate and body temperature", "Change color based on electrical stimuli"], "answer": "B", "why": "Phase-change materials <em>“adapt to temperature fluctuations, providing warmth when it’s cold and cooling when it’s hot.”<\/em>", "others": ["<b>A, C, D:<\/b> these are other smart-textile functions from the passage: piezoelectric fabrics, sensor textiles, and color-changing textiles."]}, {"n": 27, "stem": "Which of the following is <u>not<\/u> mentioned as a challenge for smart textiles?", "options": ["Washability", "Cost", "Durability", "Availability"], "answer": "D", "why": "The passage lists <em>“durability, washability, and cost,”<\/em> plus privacy. Availability is never mentioned.", "others": []}, {"n": 28, "stem": "The word <mark>“harvest”<\/mark> in the passage is closest in meaning to", "options": ["grow", "collect", "spin", "discover"], "answer": "B", "why": "To <mark>harvest<\/mark> energy is to gather or capture it, here from the wearer’s movement.", "others": ["<b>A:<\/b> “grow” relates to the farming meaning of harvest, but the fabric doesn’t grow energy."]}, {"n": 29, "stem": "What is the main purpose of paragraph 3?", "options": ["To present obstacles to the ideas previously introduced", "To expand on the benefits mentioned in paragraph 2", "To provide information on the future applications of smart textiles", "To summarize the main points of the reading"], "answer": "A", "why": "Paragraph 3 starts with <em>“Yet, integrating technology into textiles presents challenges”<\/em> and lists problems: durability, washability, cost and privacy.", "others": ["<b>B, C:<\/b> paragraph 3 is about problems, not benefits or applications.", "<b>D:<\/b> it adds new information instead of summarizing."]}, {"n": 30, "stem": "There are four locations [■] in the passage that indicate where the following sentence could be added.<br><br><em>Imagine being able to change the appearance of your furnishings depending on your mood or the season.<\/em><br><br>Where would the sentence best fit?", "options": ["Location A", "Location B", "Location C", "Location D"], "answer": "C", "why": "The sentence gives an example of <em>“interior design”<\/em>: changing the look of your furnishings. It belongs right after color-changing textiles open <em>“new possibilities for both fashion and interior design.”<\/em>", "others": ["<b>A, B:<\/b> those spots are about generating electricity, not appearance.", "<b>D:<\/b> the paragraph about challenges has already begun."]}]}, {"title": "The Mysteries of Opal", "offset": 25, "paras": ["Opal is a unique gemstone, known for its vibrant colors that shift as the stone moves. Unlike most gemstones, which form rigid, repeating crystalline structures, opals are amorphous, meaning they lack a fixed internal shape. This is due to the formation process, where silica-rich water seeps into cracks in rocks deep underground, leaving silica deposits when it evaporates. Tiny silica spheres create the internal structure of opals, and these spheres diffract light, separating it into colors, much like <mark>a prism<\/mark> does.", "The color and brilliance of opals depends on the size and spacing of the silica spheres. Larger spheres produce reds and oranges, while smaller spheres result in blues and greens. Because of Australia’s unique geological conditions, it is home to over 90 percent of the world’s opals. Opals are also fragile. Their high water content and noncrystalline structure make them prone to cracking when exposed to sudden temperature changes. Modern jewelers use techniques such as laser cutting and humidity-controlled storage to better protect opals.", "Ancient cultures believed opals had mystical properties and brought good luck. The Romans saw them as a symbol of hope and purity, while the Greeks thought they gave the gift of <mark>prophecy<\/mark>."], "questions": [{"n": 26, "stem": "All of the following are mentioned as part of the formation process of opals <u>except<\/u>", "options": ["Water flows into cracks in rocks.", "The water dries up, leaving silica deposits behind.", "Small spheres of silica create the structure of the gemstones.", "The structure formed is rigid and non-varying."], "answer": "D", "why": "The opposite is true: opals are <em>“amorphous, meaning they lack a fixed internal shape.”<\/em> Rigid crystalline structures belong to <em>“most gemstones.”<\/em>", "others": ["<b>A:<\/b> silica-rich water <em>“seeps into cracks in rocks.”<\/em>", "<b>B:<\/b> it leaves <em>“silica deposits when it evaporates.”<\/em>", "<b>C:<\/b> <em>“Tiny silica spheres create the internal structure of opals.”<\/em>"]}, {"n": 27, "stem": "Why does the author mention <mark>“a prism”<\/mark>?", "options": ["To illustrate how an opal affects light", "To explain how the internal structure of opals is created", "To give an example of how scientists study opals", "To argue that opals do not truly diffract light"], "answer": "A", "why": "The silica spheres <em>“diffract light, separating it into colors, much like a prism does.”<\/em> The prism is a familiar comparison for this effect.", "others": ["<b>B:<\/b> the prism explains what the structure does to light, not how the structure forms.", "<b>C:<\/b> scientists’ methods are not discussed.", "<b>D:<\/b> the comparison supports the idea that opals diffract light."]}, {"n": 28, "stem": "What is one consequence of the internal structure of opals?", "options": ["90 percent of them are red or orange.", "Relatively little ancient opal jewelry has survived.", "They are easily damaged by water.", "Jewelers must use special care to prevent opals from cracking."], "answer": "D", "why": "Opals’ <em>“noncrystalline structure”<\/em> makes them <em>“prone to cracking,”<\/em> so jewelers <em>“use techniques such as laser cutting and humidity-controlled storage to better protect opals.”<\/em>", "others": ["<b>A:<\/b> the 90 percent refers to Australia’s share of the world’s opals.", "<b>B:<\/b> ancient jewelry is not mentioned.", "<b>C:<\/b> sudden temperature changes cause cracking, not water."]}, {"n": 29, "stem": "What does the passage suggest about ancient cultures’ view of opals?", "options": ["They understood how opals were formed.", "They found opals difficult to work with.", "They believed opals had special qualities that benefited their owners.", "They considered opals to be very durable."], "answer": "C", "why": "Ancient cultures believed opals had <em>“mystical properties and brought good luck,”<\/em> and the Greeks thought they gave <em>“the gift of prophecy.”<\/em>", "others": ["<b>A, B, D:<\/b> none of these is mentioned about ancient cultures."]}, {"n": 30, "stem": "The word <mark>“prophecy”<\/mark> in the passage is closest in meaning to", "options": ["long life", "the ability to predict the future", "happiness", "high status"], "answer": "B", "why": "<mark>Prophecy<\/mark> is the power to foretell what will happen. A prophet is someone who has this gift.", "others": []}]}, {"title": "Radio Astronomy: A New Perspective", "offset": 30, "paras": ["Radio astronomy is the study of celestial objects using radio waves rather than visible light. Unlike optical telescopes, radio telescopes can detect signals from sources obscured by dust or too faint to be seen with traditional instruments. This branch of astronomy has led to <mark>transformative<\/mark> discoveries, including the detection of cosmic microwave background radiation—a faint glow left over from the Big Bang—which has enabled scientists to reconstruct the universe’s early conditions.", "One of the most famous radio astronomy discoveries was the identification of pulsars in 1967. These rapidly spinning neutron stars, the dense remnants of massive stars that have exploded, emit beams of radio waves at regular intervals. Observing pulsars helps scientists understand the end stages of stellar life and the behavior of matter under extreme conditions.", "However, radio astronomy faces growing challenges due to technological interference. Devices like mobile phones, wireless routers, and satellites emit radio frequencies that can overwhelm the faint cosmic signals astronomers seek to detect. This “radio frequency pollution” makes it increasingly difficult to isolate genuine astronomical data. To combat this, observatories are often located in remote areas and protected by radio quiet zones, but <mark>the global spread of wireless technology<\/mark> continues to pose a serious threat."], "questions": [{"n": 31, "stem": "What does the comparison of optical and radio telescopes suggest?", "options": ["Traditional instruments are more susceptible to damage.", "Dust often interferes with the optical detection of objects in space.", "Radio telescopes are best for detecting massive stars.", "Optical telescopes were the first to detect cosmic microwave background radiation."], "answer": "B", "why": "Radio telescopes, <em>“unlike optical telescopes,”<\/em> can detect <em>“sources obscured by dust.”<\/em> So optical telescopes can be blocked by dust.", "others": ["<b>A:<\/b> damage is not mentioned.", "<b>C:<\/b> the passage never says radio telescopes are best for massive stars.", "<b>D:<\/b> the passage presents this as a radio astronomy discovery."]}, {"n": 32, "stem": "The word <mark>“transformative”<\/mark> in the passage is closest in meaning to", "options": ["groundbreaking", "exciting", "concerning", "startling"], "answer": "A", "why": "<mark>Transformative<\/mark> discoveries change a field fundamentally, which is what “groundbreaking” means.", "others": ["<b>B, D:<\/b> “exciting” and “startling” describe emotional reactions, not the scale of change.", "<b>C:<\/b> “concerning” is negative."]}, {"n": 33, "stem": "According to the passage, radio astronomy helps scientists study all of the following <u>except<\/u>", "options": ["the beginnings of the universe", "how to prevent the explosions of large stars", "the last stages of stars", "the way matter behaves under extreme conditions"], "answer": "B", "why": "Pulsars are the remains of stars <em>“that have exploded.”<\/em> Studying them explains how stars end, not how to stop explosions.", "others": ["<b>A:<\/b> background radiation helps <em>“reconstruct the universe’s early conditions.”<\/em>", "<b>C:<\/b> pulsars help explain <em>“the end stages of stellar life.”<\/em>", "<b>D:<\/b> and <em>“the behavior of matter under extreme conditions.”<\/em>"]}, {"n": 34, "stem": "Why does the author mention <mark>“the global spread of wireless technology”<\/mark>?", "options": ["To suggest that the issue of technological interference is not likely to end soon", "To argue that technological interference is not as severe as was once thought", "To support the argument that optical telescopes are more reliable than radio telescopes", "To highlight the sophisticated tools astronomers use to detect cosmic signals"], "answer": "A", "why": "Even with remote locations and quiet zones, wireless technology <em>“continues to pose a serious threat.”<\/em> The problem is growing, not going away.", "others": ["<b>B:<\/b> the opposite.", "<b>C:<\/b> optical telescopes are not discussed in paragraph 3.", "<b>D:<\/b> the phrase is about the problem, not astronomers’ tools."]}, {"n": 35, "stem": "According to the passage, what is one way to address the issue of technological interference?", "options": ["Revive the use of optical telescopes", "Limit wireless routers to certain frequencies", "Place observatories far away from urban areas", "Mandate specific quiet times when the use of wireless technology is prohibited"], "answer": "C", "why": "Observatories <em>“are often located in remote areas and protected by radio quiet zones.”<\/em>", "others": ["<b>A, B:<\/b> not mentioned.", "<b>D:<\/b> radio quiet zones are areas, not quiet <i>times<\/i>. A trap built on the word “quiet.”"]}]}, {"title": "Video Evidence in U.S. Courts", "offset": 10, "paras": ["In the United States, as in some other countries, video evidence has become integral to the criminal justice system as technological advances have made cameras nearly ubiquitous. Police officers often wear body cameras, security cameras monitor public areas, and nearly everyone carries a smartphone capable of recording high-quality videos. While such recordings are widely seen as reliable evidentiary tools, they have certain limitations.", "For example, videos are usually taken from a single vantage point, potentially giving viewers a misleading impression of events. A single camera angle might fail to capture what occurs just outside the frame, leading observers to misinterpret what they see. Additionally, video footage has no way of conveying interpersonal and emotional <mark>context<\/mark>: A person’s actions might appear antagonistic even if the person was acting in self-defense.", "Despite these limitations, <mark>legal experts<\/mark> emphasize that video evidence plays a significant role in courtrooms. Jurors (people chosen to consider evidence and decide a case) might dismiss eyewitness testimonies as unreliable or perceive oral accounts as inconsistent, while videos show events more directly. When multiple recordings are available from different angles, an even more reliable sense of an incident can emerge. Nevertheless, courts often remind jurors to evaluate video evidence <mark>cautiously<\/mark>."], "questions": [{"n": 11, "stem": "What is the relationship between the first sentence and the second sentence of the passage?", "options": ["The first sentence makes a generalization, and the second sentence introduces exceptions to the generalization.", "The first sentence presents one view of a subject, and the second sentence presents a contrasting view.", "The first sentence makes a claim, and the second sentence provides examples to illustrate that claim.", "The first sentence introduces a question, and the second sentence offers possible answers to the question."], "answer": "C", "why": "Sentence 1 claims cameras are <em>“nearly ubiquitous.”<\/em> Sentence 2 gives examples: police body cameras, security cameras and smartphones.", "others": ["<b>A, B:<\/b> sentence 2 supports sentence 1; it doesn't limit or contradict it.", "<b>D:<\/b> sentence 1 is a statement, not a question."]}, {"n": 12, "stem": "The passage suggests which of the following about viewers of videos?", "options": ["They are more likely to trust the accuracy of a video recorded on a police officer’s body camera than one taken with a smartphone.", "They may not find a video recording of an incident as revealing as an eyewitness account of the event.", "They may not see actions that are critical to understanding an incident because of the way the video is framed.", "They are likely to regard video recordings skeptically because they know that videos can be misleading."], "answer": "C", "why": "A single camera angle <em>“might fail to capture what occurs just outside the frame, leading observers to misinterpret what they see.”<\/em>", "others": ["<b>A:<\/b> the passage never compares body cameras and smartphones.", "<b>B:<\/b> the opposite. Jurors may find eyewitness accounts less reliable than videos.", "<b>D:<\/b> the opposite. Videos are <em>“widely seen as reliable,”<\/em> which is why courts remind jurors to be careful."]}, {"n": 13, "stem": "What does the author point out when discussing <mark>“context”<\/mark>?", "options": ["The setting in which a video is viewed may affect the way viewers perceive the recorded events.", "People may draw incorrect conclusions about others’ motivations from what they observe in a video.", "Video recordings can be used either to defend an individual’s actions or to depict the individual as an aggressor.", "The reliability of video recordings of events should be compared to the reliability of oral accounts of those events."], "answer": "B", "why": "Because video can’t show emotional <mark>context<\/mark>, <em>“a person’s actions might appear antagonistic even if the person was acting in self-defense.”<\/em> Viewers misjudge why the person acted.", "others": ["<b>A:<\/b> the context meant is the context of the event, not where the video is watched.", "<b>C:<\/b> close, but the point is that viewers can be misled, not how videos can be used.", "<b>D:<\/b> oral accounts are compared in paragraph 3, not here."]}, {"n": 14, "stem": "The passage indicates that <mark>“legal experts”<\/mark> hold which of the following views?", "options": ["Jurors are likely to accept videos as objective depictions of events whereas they view witness testimony with skepticism.", "Recent improvements in technology have made it so easy to display video evidence to jurors that other kinds of evidence may be neglected.", "Video recordings should not be used as evidence in courtrooms unless multiple recordings taken from different vantage points can be shown.", "Courts should not undermine jurors’ decision-making abilities by overemphasizing the possibility of misinterpreting videos."], "answer": "A", "why": "Legal experts say jurors <em>“might dismiss eyewitness testimonies as unreliable… while videos show events more directly.”<\/em>", "others": ["<b>B, D:<\/b> not mentioned.", "<b>C:<\/b> too strong. Multiple angles give <em>“an even more reliable sense,”<\/em> but single videos are not ruled out."]}, {"n": 15, "stem": "The word <mark>“cautiously”<\/mark> in the passage is closest in meaning to", "options": ["reluctantly", "carefully", "decisively", "confidently"], "answer": "B", "why": "To evaluate evidence <mark>cautiously<\/mark> is to do it carefully, aware that it might mislead.", "others": ["<b>A:<\/b> “reluctantly” means unwillingly, which is a different idea.", "<b>C, D:<\/b> close to the opposite."]}]}, {"title": "Twin Stars", "offset": 30, "paras": ["Stars form in the relatively dense, egg-shaped cores of molecular clouds made of dust and gases. Scientists mapping these dense cores must use radio waves to <mark>penetrate<\/mark> the dust and gases that prevent light from escaping molecular clouds; satellite images of these regions show nothing but large, black areas of space.", "Recent observations of the Perseus molecular cloud may have surprising implications for <mark>previously accepted conclusions<\/mark> about the Sun. A radio wave sweep of the Perseus cloud’s dense cores revealed that the youngest stars existing in the cloud all occurred in pairs, or binary twins, orbiting a common point. Stars of older binary systems, of which there were fewer, appeared closer together than stars of younger binary systems.", "Scientists used current knowledge about stellar growth, decay, and destruction to
