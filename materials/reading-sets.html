<style>
/* Layout: set list on the left (desktop) or a picker (phone); passage beside its questions, like the test screen. */
:root{
  --bg:#f3f5f4; --paper:#ffffff; --ink:#1b2422; --muted:#5b6a67; --rule:#d9e0de;
  --accent:#2f6b66; --accent-ink:#ffffff; --accent-soft:#e2efed;
  --mark:#ffe28a; --mark-ink:#1b2422;
  --good:#1d6b3a; --good-bg:#e0f2e6; --bad:#b42318; --bad-bg:#fde8e5;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111716; --paper:#18201f; --ink:#e4ebe9; --muted:#97a6a3; --rule:#2a3533;
  --accent:#7cc4bb; --accent-ink:#0e1514; --accent-soft:#1d2e2c;
  --mark:#5c4d14; --mark-ink:#fff4cc;
  --good:#86d6a2; --good-bg:#16301f; --bad:#ff9a8a; --bad-bg:#3a1c19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111716; --paper:#18201f; --ink:#e4ebe9; --muted:#97a6a3; --rule:#2a3533;
  --accent:#7cc4bb; --accent-ink:#0e1514; --accent-soft:#1d2e2c;
  --mark:#5c4d14; --mark-ink:#fff4cc;
  --good:#86d6a2; --good-bg:#16301f; --bad:#ff9a8a; --bad-bg:#3a1c19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.shell{max-width:1320px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}
header.top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;border-bottom:3px solid var(--accent);padding-bottom:12px}
header.top h1{font-family:var(--serif);font-weight:600;font-size:1.7rem;margin:0;text-wrap:balance}
header.top p{margin:0;color:var(--muted);font-size:.9rem}
nav.sets{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:grid;gap:2px;max-height:calc(100vh - 40px);overflow:auto;padding-right:4px}
nav.sets .label{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px 10px}
nav.sets button{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;padding:8px 10px;border-radius:6px;color:var(--ink);font-size:.9rem;line-height:1.3}
nav.sets button .num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.78rem;width:1.6em;text-align:right}
nav.sets button:hover{background:var(--accent-soft)}
nav.sets button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
nav.sets button[aria-current="true"] .num{color:var(--accent-ink)}
nav.sets button .done{grid-column:2;font-size:.75rem;opacity:.85}
nav.sets button:focus-visible,.opt:focus-visible,.btn:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.picker{display:none}
main{min-width:0;display:grid;gap:16px}
.setbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.setbar h2{font-family:var(--serif);font-size:1.5rem;font-weight:600;margin:0;text-wrap:balance}
.setbar .meta{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
.passage{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:22px clamp(16px,3vw,28px);position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);overflow:auto;min-width:0}
.passage p{font-family:var(--serif);font-size:1.04rem;line-height:1.75;margin:0 0 14px;max-width:68ch}
.passage p:last-child{margin-bottom:0}
.passage .pn{font-family:var(--sans);font-size:.72rem;font-weight:600;color:var(--accent);margin-right:6px;vertical-align:1px}
mark{background:var(--mark);color:var(--mark-ink);padding:0 2px;border-radius:2px;font-weight:600}
.sq{font-family:var(--sans);font-size:.78rem;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:3px;white-space:nowrap}
.qs{display:grid;gap:14px;min-width:0}
.q{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;display:grid;gap:12px}
.q .stem{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;font-weight:600}
.q .badge{background:var(--accent);color:var(--accent-ink);font-size:.8rem;font-weight:600;min-width:2em;height:1.9em;display:grid;place-items:center;border-radius:4px;font-variant-numeric:tabular-nums}
.q .stem em{font-family:var(--serif);font-weight:400}
.opts{display:grid;gap:6px}
.opt{all:unset;cursor:pointer;display:grid;grid-template-columns:1.6em 1fr;gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;font-size:.94rem;line-height:1.4}
.opt .l{font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.checked .opt{cursor:default}
.checked .opt.right{border-color:var(--good);background:var(--good-bg)}
.checked .opt.right .l{color:var(--good)}
.checked .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.checked .opt.wrong .l{color:var(--bad)}
.verdict{font-size:.82rem;font-weight:600}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.why{border-top:1px solid var(--rule);padding-top:10px;font-size:.9rem;display:grid;gap:6px}
.why em{font-family:var(--serif)}
.why ul{margin:0;padding-left:1.1em;display:grid;gap:3px;color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{all:unset;cursor:pointer;padding:9px 16px;border-radius:6px;font-weight:600;font-size:.9rem;border:1px solid var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.score{font-weight:600;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:.85rem}
@media (max-width:1000px){.cols{grid-template-columns:minmax(0,1fr)}.passage{position:static;max-height:none}}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.sets{display:none}
  .picker{display:grid;gap:4px}
  .picker label{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .picker{min-width:0}
  .picker select{width:100%;min-width:0;font:inherit;padding:9px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);max-width:100%}
}
@media (prefers-reduced-motion:no-preference){.opt,nav.sets button{transition:background-color .15s,border-color .15s}}

<div class="shell">
  <header class="top">

      </section>
