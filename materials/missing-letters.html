<style>
/* Layout: index of topics → task view with the paragraph and letter boxes, like the test screen. */
:root{
  --bg:#f3f5f4; --paper:#ffffff; --ink:#1b2422; --muted:#5b6a67; --rule:#d9e0de;
  --accent:#2f6b66; --accent-ink:#ffffff; --accent-soft:#e2efed;

  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111716; --paper:#18201f; --ink:#e4ebe9; --muted:#97a6a3; --rule:#2a3533;
  --accent:#7cc4bb; --accent-ink:#0e1514; --accent-soft:#1d2e2c; --box:#1f2927; --box-line:#4c5e5b;

:root[data-theme="dark"]{
  --bg:#111716; --paper:#18201f; --ink:#e4ebe9; --muted:#97a6a3; --rule:#2a3533;
  --accent:#7cc4bb; --accent-ink:#0e1514; --accent-soft:#1d2e2c; --box:#1f2927; --box-line:#4c5e5b;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-block:22px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;border-bottom:3px solid var(--accent);padding-bottom:12px;margin-bottom:22px}
h1{font-family:var(--serif);font-weight:600;font-size:1.8rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.btn{all:unset;cursor:pointer;padding:8px 16px;border-radius:7px;font-weight:600;font-size:.9rem;border:1.5px solid var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.tcard:focus-visible,.lb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* index */
.topic{margin-bottom:26px}
.topic h2{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:0 0 10px;display:flex;gap:8px;align-items:baseline}
.topic h2 span{color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.tcard{all:unset;cursor:pointer;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:11px 13px;display:grid;gap:3px;min-width:0}
.tcard:hover{border-color:var(--accent)}
.tcard b{font-weight:600;font-size:.96rem}
.tcard small{color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums}
.tcard small.done{color:var(--good);font-weight:600}
/* task */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.crumb{color:var(--muted);font-size:.85rem}
.crumb b{color:var(--ink)}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:22px clamp(16px,3.5vw,34px)}
.panel h2{font-family:var(--serif);font-weight:600;font-size:1.45rem;margin:0 0 4px}
.panel .instr{color:var(--muted);font-size:.9rem;margin:0 0 16px}
.para{font-family:var(--serif);font-size:1.12rem;line-height:2.25;max-width:72ch}
.gap{white-space:nowrap;display:inline-flex;align-items:baseline}
.lb{width:1.05em;height:1.5em;border:none;border-bottom:2px solid var(--box-line);background:var(--box);font:500 1rem var(--mono);text-align:center;color:var(--ink);margin:0 1px;padding:0;border-radius:2px 2px 0 0;vertical-align:baseline;text-transform:lowercase}
.lb:focus{outline:none;border-bottom-color:var(--accent);background:var(--accent-soft)}
.gap.ok .lb{background:var(--good-bg);border-bottom-color:var(--good);color:var(--good)}
.gap.no .lb{background:var(--bad-bg);border-bottom-color:var(--bad);color:var(--bad)}
.fix{font:500 .82rem var(--sans);color:var(--good);margin-left:4px;background:var(--good-bg);padding:0 5px;border-radius:4px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.score{font-weight:600;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:.85rem;margin-top:10px}
.hidden{display:none!important}
@media (max-width:520px){.para{font-size:1.02rem;line-height:2.1}.lb{width:1em}}
</style>

    const g=sec.querySelector(".grid");
    list.forEach(([t,i])=>{
      const b=document.createElement("button"); b.type="button"; b.className="tcard";
      const n=t.parts.filter(p=>typeof p==="object").length, r=results[t.id];
      b.innerHTML=`<b>${esc(t.name)}</b><small class="${r?"done":""}">${r?`Score: ${r}`:`${n} gaps`}</small>`;
      b.onclick=()=>open(i); g.appendChild(b);
    });
    ix.appendChild(sec);
  });
}

function open(i){
  cur=i; const t=T[i];
  $("index").classList.add("hidden"); $("task").classList.remove("hidden");
  $("tname").textContent=t.name;
  $("crumb").innerHTML=`${esc(t.topic)} · <b>${i+1}</b> of ${T.length}`;
  $("prev").disabled = i===0; $("next").disabled = i===T.length-1;
  const para=$("para"); para.innerHTML=""; let g=0;
  t.parts.forEach(p=>{
    if(typeof p==="string"){ para.appendChild(document.createTextNode(p)); return; }
    const span=document.createElement("span"); span.className="gap"; span.dataset.g=g++;
    span.appendChild(document.createTextNode(p.shown));
    for(let k=0;k<p.miss.length;k++){
      const inp=document.createElement("input"); inp.className="lb"; inp.maxLength=1;
      inp.setAttribute("aria-label",`Missing letter ${k+1} of ${p.miss.length} after "${p.shown}"`);
      inp.autocomplete="off"; inp.autocapitalize="off"; inp.spellcheck=false;
      span.appendChild(inp);
    }
    para.appendChild(span);
  });
  const boxes=[...para.querySelectorAll(".lb")];
  boxes.forEach((b,k)=>{
    b.addEventListener("input",()=>{ b.value=b.value.replace(/[^a-zA-Z]/g,"").slice(-1).toLowerCase(); if(b.value&&boxes[k+1]) boxes[k+1].focus(); });
    b.addEventListener("keydown",e=>{
      if(e.key==="Backspace"&&!b.value&&boxes[k-1]){ boxes[k-1].focus(); boxes[k-1].value=""; e.preventDefault(); }
      if(e.key==="ArrowLeft"&&boxes[k-1]) boxes[k-1].focus();
      if(e.key==="ArrowRight"&&boxes[k+1]) boxes[k+1].focus();
    });
  });
  $("score").textContent=""; $("check").disabled=false;
  try{ history.replaceState(null,"","#"+t.id); }catch(e){}
  window.scrollTo({top:0});
  if(boxes[0] && matchMedia("(pointer:fine)").matches) boxes[0].focus();
}

function check(){
  const t=T[cur]; const gaps=[...$("para").querySelectorAll(".gap")]; let ok=0;
  const parts=t.parts.filter(p=>typeof p==="object");
  gaps.forEach((s,i)=>{
    const want=parts[i].miss.toLowerCase();
    const got=[...s.querySelectorAll(".lb")].map(b=>b.value.toLowerCase()).join("");
    s.querySelector(".fix")?.remove();
    s.classList.remove("ok","no");
    if(got===want){ s.classList.add("ok"); ok++; }
    else { s.classList.add("no"); const f=document.createElement("span"); f.className="fix"; f.textContent=parts[i].shown+parts[i].miss; s.appendChild(f); }
  });
  $("score").textContent=`Score: ${ok} / ${gaps.length}`;
  results[t.id]=`${ok}/${gaps.length}`; store.set("fm-results",results);
}
function reset(){ open(cur); }

$("check").onclick=check; $("reset").onclick=reset;
$("back").onclick=()=>{ $("task").classList.add("hidden"); $("index").classList.remove("hidden"); renderIndex(); try{ history.replaceState(null,"",location.pathname); }catch(e){} window.scrollTo({top:0}); };
$("prev").onclick=()=>cur>0&&open(cur-1);
$("next").onclick=()=>cur<T.length-1&&open(cur+1);

renderIndex();
const h=location.hash.slice(1); const hi=T.findIndex(t=>t.id===h);
if(hi>=0) open(hi);
</script>
