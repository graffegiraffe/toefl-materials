<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Printing Services and Music Preferences: Listen and Repeat + Interview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: test-screen replica — teal brand bar, Speaking strip, centred task with picture, audio bar and RESPONSE TIME box */
:root{
  --teal:#2f6b70; --teal-dark:#24575b; --teal-soft:#e4efef;
  --bg:#ffffff; --surface:#ffffff; --panel:#f4f7f7; --fg:#1d2524; --muted:#5d6967; --line:#2b3332; --rule:#d5dddc;
  --ok:#1f8a4c; --ok-bg:#e6f5ec; --bad:#c0392b; --bad-bg:#fbeaea; --amber:#c8930f;
  --f-ui:"Open Sans","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --teal:#5fa5aa; --teal-dark:#7cbcc0; --teal-soft:#1d3335; --bg:#0f1716; --surface:#172221; --panel:#141e1d; --fg:#e4ecea; --muted:#9db0ae; --line:#6d807e; --rule:#2c3d3c;
  --ok:#55c486; --ok-bg:#163327; --bad:#ef7b6e; --bad-bg:#3a1c19; --amber:#f0b35c; color-scheme:dark}}
:root[data-theme="dark"]{
  --teal:#5fa5aa; --teal-dark:#7cbcc0; --teal-soft:#1d3335; --bg:#0f1716; --surface:#172221; --panel:#141e1d; --fg:#e4ecea; --muted:#9db0ae; --line:#6d807e; --rule:#2c3d3c;
  --ok:#55c486; --ok-bg:#163327; --bad:#ef7b6e; --bad-bg:#3a1c19; --amber:#f0b35c; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#2f6b70}
.topbar{background:#2f6b70;color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.topbar .in{display:flex;align-items:center;gap:12px;min-height:60px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{background:#3d7f84;border-radius:22px;padding:7px 15px;font-weight:600;white-space:nowrap;font-size:15px}
.ttl{font-weight:700;white-space:nowrap}.sp{flex:1}
.nb{border:2px solid #cfe0e1;background:transparent;color:#fff;border-radius:11px;padding:8px 16px;font-weight:700;white-space:nowrap}
.nb:hover{background:#24575b}.nb.next{background:#fff;color:#2f6b70;border-color:#fff}.nb:disabled{opacity:.4;cursor:default}
.subbar{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.subbar .sec{font-size:19px;font-weight:600}.subbar .sepr{color:var(--muted)}.subbar .qn{font-weight:600}
.clock{font-weight:700;font-variant-numeric:tabular-nums}
.link{background:none;border:none;color:var(--teal);font-weight:600;padding:4px}
main{max-width:1000px;margin:0 auto;padding-block:26px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
h1.h{font-size:clamp(22px,3vw,30px);font-weight:700;margin:0;text-wrap:balance;line-height:1.35}
h1.h.long{font-size:clamp(18px,2.3vw,23px);font-weight:600;max-width:860px}
.pic{display:block;width:min(100%,460px);height:auto;border:2px solid var(--line);border-radius:4px;background:#fff;image-rendering:auto}
.pic.person{width:min(100%,400px);border:none;border-radius:10px}

/* audio bar */
.player{display:flex;align-items:center;gap:12px;width:min(100%,410px);background:var(--surface);border-radius:12px;padding:10px 14px;box-shadow:0 2px 10px rgba(0,0,0,.14)}
.pbtn{flex:0 0 36px;height:36px;border-radius:50%;border:none;background:var(--teal-soft);display:grid;place-items:center;color:var(--teal);cursor:default}
.pbtn.blink{background:var(--teal);color:var(--bg);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.pbtn svg{width:16px;height:16px;fill:currentColor}
.track{flex:1;height:8px;border-radius:4px;background:var(--rule);overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--teal)}
.ptime{font-size:13px;color:var(--teal);font-variant-numeric:tabular-nums;white-space:nowrap}

/* response box */
.resp{width:min(100%,280px);border:2px solid var(--teal);border-radius:12px;overflow:hidden;background:var(--surface)}
.resp .rh{background:var(--teal);color:#fff;font-weight:700;letter-spacing:.06em;padding:9px;font-size:15px}
.resp.idle .rh{background:#6b7473}.resp.idle{border-color:#6b7473}
.resp .rb{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;font-size:24px;font-variant-numeric:tabular-nums}
.ring{width:30px;height:30px}
.ring circle{fill:none;stroke-width:4}
.ring .bgc{stroke:var(--rule)}.ring .fgc{stroke:var(--teal);transition:stroke-dashoffset .25s linear}
.meter{display:flex;gap:3px;justify-content:center;align-items:flex-end;height:18px}
.meter i{width:8px;border:1px solid var(--muted);border-radius:1px;height:100%;background:transparent}
.meter i.on{background:var(--ok);border-color:var(--ok)}
.meter i.on.hi{background:var(--amber);border-color:var(--amber)}
.status{min-height:26px;font-weight:600;color:var(--teal);font-size:17px}
.status.go{color:var(--bad)}
.getready{font-size:15px;color:var(--muted)}

/* panels */
.card{max-width:760px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:22px 26px;line-height:1.6;font-size:16.5px}
.card h2{margin:0 0 10px;font-size:24px}
.card ol{padding-left:20px;margin:0 0 14px}.card li{margin-bottom:6px}
.opt{display:flex;gap:10px;align-items:center;margin:12px 0}
.bigbtn{border:none;background:var(--teal);color:var(--bg);font-weight:700;letter-spacing:.06em;border-radius:12px;padding:13px 34px;font-size:17px}
.ghostbtn{border:2px solid var(--teal);background:transparent;color:var(--teal);font-weight:700;border-radius:10px;padding:8px 18px}
.note{font-size:14px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.overlay[hidden]{display:none}
.modal{background:var(--surface);color:var(--fg);border-radius:12px;padding:22px 26px;max-width:380px;text-align:left;line-height:1.5}
.modal b{display:block;font-size:18px;margin-bottom:6px}
.recs{width:100%;max-width:760px;display:flex;flex-direction:column;gap:10px;text-align:left}
.rec{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:10px 14px}
.rec b{min-width:110px}
.rec audio{flex:1;min-width:220px;max-width:100%}
.rec a{color:var(--teal);font-weight:600;font-size:14px}

.keyrow{flex-direction:column;align-items:stretch}
.kq{display:flex;gap:12px;align-items:baseline}
.kn{flex:0 0 28px;height:28px;border-radius:50%;background:var(--teal);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px}
.kt{font-size:17px;font-weight:600;line-height:1.45}
.kplay{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-left:40px}
.ghostbtn.sm{padding:5px 12px;font-size:14px}
.sh{width:100%;max-width:760px;text-align:left;margin:14px 0 0;font-size:20px;color:var(--teal)}
.lab{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.lab.muted{font-weight:600;text-transform:none;letter-spacing:0}
@media (max-width:700px){
  .ttl{display:none}.nb{padding:7px 12px;font-size:15px}
  .card{padding:18px}
}
</style>
</head>

const timers=[];
function later(fn,ms){ const id=setTimeout(fn,ms); timers.push(id); return id; }

const fmt=s=>{ s=Math.max(0,Math.ceil(s)); return '00:'+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
const PLAY='<svg viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z"/></svg>', PAUSE='<svg viewBox="0 0 16 16"><path d="M3 1h3.5v14H3zM9.5 1H13v14H9.5z"/></svg>';

/* ---------- sound ---------- */
function beep(){
  try{
    if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime;
    o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.18,t+0.02); g.gain.setValueAtTime(0.18,t+0.28); g.gain.exponentialRampToValueAtTime(0.0001,t+0.36);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+0.4);
  }catch(e){}
}
function playClip(name, bar, done){
  aud.src=M[name]; aud.currentTime=0;
  const tr=bar&&bar.querySelector('i'), tm=bar&&bar.querySelector('.ptime'), pb=bar&&bar.querySelector('.pbtn');
  aud.ontimeupdate=()=>{ if(!bar||!isFinite(aud.duration)) return; tr.style.width=(aud.currentTime/aud.duration*100)+'%'; tm.textContent=mmss(aud.currentTime)+' / '+mmss(aud.duration); };
  aud.onended=()=>{ if(pb) pb.innerHTML=PLAY; if(tr) tr.style.width='100%'; done&&done(); };
  if(pb) pb.innerHTML=PAUSE;
  aud.muted=false; aud.volume=1;
  const p=aud.play(); if(p&&p.catch) p.catch(()=>{ if(pb){ pb.innerHTML=PLAY; pb.style.cursor='pointer'; pb.classList.add('blink'); const st=$('st'); if(st) st.textContent='Tap ▶ to play the question'; pb.onclick=()=>{ pb.onclick=null; pb.classList.remove('blink'); if(st) st.textContent='Listen…'; playClip(name,bar,done); }; } });
}
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
function playerHTML(){ return `<div class="player" id="pl"><span class="pbtn">${PLAY}</span><span class="track"><i></i></span><span class="ptime">00:00 / 00:00</span><span class="ptime">1.0 x</span></div>`; }

/* ---------- microphone (optional) ---------- */
async function initMic(){
  if(!recOn) return false;
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
    const src=ac.createMediaStreamSource(stream); analyser=ac.createAnalyser(); analyser.fftSize=512; src.connect(analyser);
    return true;
  }catch(e){ stream=null; return false; }
}
function startRec(n){
  if(!stream||!window.MediaRecorder) return;
  try{
    const chunks=[]; const mr=new MediaRecorder(stream); mediaRec=mr;
    mr.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    mr.onstop=()=>{ if(chunks.length){ if(recs[n]) URL.revokeObjectURL(recs[n].url); const b=new Blob(chunks,{type:mr.mimeType||'audio/webm'}); recs[n]={url:URL.createObjectURL(b),type:b.type}; } };
    mr.start();
  }catch(e){ mediaRec=null; }
}
function stopRec(){ try{ if(mediaRec&&mediaRec.state!=='inactive') mediaRec.stop(); }catch(e){} mediaRec=null; }
function level(){ if(!analyser) return 0; const d=new Uint8Array(analyser.fftSize); analyser.getByteTimeDomainData(d); let s=0; for(const v of d){ const x=(v-128)/128; s+=x*x; } return Math.min(1,Math.sqrt(s/d.length)*4); }

/* ---------- screens ---------- */
function render(){
  clearAll(); const my=++run; const S=SCREENS[cur];
  $('backBtn').disabled=cur<=1; $('nextBtn').disabled=cur===0||cur===SCREENS.length-1;
  $('qn').textContent = S.t==='q' ? `Question ${S.n} of 11` : ''; $('sepr').hidden = S.t!=='q';
  if(S.t==='start') return startScreen();
  if(S.t==='end') return endScreen();
  if(S.t==='info'){
    main.innerHTML=`<div class="card"><h2>${S.title}</h2>${S.body.map(p=>`<p>${p}</p>`).join('')}</div>${S.audio?playerHTML():''}`;
    if(S.audio) later(()=>playClip(S.audio,$('pl'),()=>later(()=>{ if(my===run) go(1); },1500)),600);
    else later(()=>{ if(my===run) go(1); },(S.wait||8)*1000);
    return;
  }
  if(S.t==='dir'){
    main.innerHTML=`<h1 class="h long">${S.text}</h1>${S.img?`<img class="pic ${S.person?'person':''}" src="${M[S.img]}" alt="">`:''}${playerHTML()}`;
    later(()=>playClip(S.audio,$('pl'),()=>later(()=>{ if(my===run) go(1); },1800)),600); return;
  }
  // question
  const head = S.kind==='lr' ? 'Listen and repeat only once.' : "Please answer the interviewer's questions.";
  const C=2*Math.PI*12;
  main.innerHTML=`<h1 class="h">${head}</h1>${S.img?`<img class="pic ${S.kind==='int'?'person':''}" src="${M[S.img]}" alt="">`:''}${playerHTML()}
    <div class="status" id="st">Listen…</div>
    <div class="resp idle" id="rb"><div class="rh">RESPONSE TIME</div><div class="rb"><svg class="ring" viewBox="0 0 30 30"><circle class="bgc" cx="15" cy="15" r="12"/><circle class="fgc" id="fg" cx="15" cy="15" r="12" stroke-dasharray="${C}" stroke-dashoffset="0" transform="rotate(-90 15 15)"/></svg><span id="rt">${fmt(S.time)}</span></div></div>
    <div class="meter" id="mt">${'<i></i>'.repeat(14)}</div>`;
  if(!stream) $('mt').hidden=true;
  later(()=>playClip(S.audio,$('pl'),()=>{
    if(my!==run) return;
    // pause before the beep
    let left=PAUSE_BEFORE_BEEP; const st=$('st');
    st.innerHTML=`Get ready… <span class="getready">beep in ${Math.ceil(left)}</span>`;
    window._iv=setInterval(()=>{ left-=1; if(left>0) st.innerHTML=`Get ready… <span class="getready">beep in ${Math.ceil(left)}</span>`; },1000);
    later(()=>{ clearInterval(window._iv); if(my!==run) return; beep(); later(()=>speak(S,my),400); }, PAUSE_BEFORE_BEEP*1000);
  }),700);
}
function speak(S,my){
  const st=$('st'), rb=$('rb'), rt=$('rt'), fg=$('fg'), C=2*Math.PI*12;
  st.textContent='Speak now'; st.classList.add('go'); rb.classList.remove('idle');
  startRec(S.n);
  const t0=performance.now(), T=S.time*1000;
  const bars=[...document.querySelectorAll('#mt i')];
  window._iv=setInterval(()=>{
    if(my!==run) return;
    const el=performance.now()-t0, rem=(T-el)/1000;
    rt.textContent=fmt(rem); fg.style.strokeDashoffset=String(C*Math.min(1,el/T));
    if(analyser){ const lv=level(), k=Math.round(lv*bars.length); bars.forEach((b,i)=>{ b.className = i<k ? (i>=bars.length*0.75?'on hi':'on') : ''; }); }
    if(el>=T){
      clearInterval(window._iv); stopRec(); rt.textContent=fmt(0); st.textContent='Time is up'; st.classList.remove('go');
      $('ov').hidden=false;
      later(()=>{ if(my===run){ $('ov').hidden=true; go(1); } },2200);
    }
  },100);
}
function startScreen(){
  main.innerHTML=`<div class="card"><h2>Speaking Practice</h2>
    <p><b>Part 1, Listen and Repeat</b> (7 questions): listen to the speaker, wait for the beep, then repeat the sentence once. You have 7–8 seconds for the shorter sentences and 10–12 seconds for the longer ones at the end.</p>
    <p><b>Part 2, Take an Interview</b> (4 questions): listen to the interviewer, wait for the beep, then answer. You have 45 seconds for each answer.</p>
    <p>At the end you'll see the answer key next to your recordings, so you can compare them.</p>
    <p>After every prompt there is a short pause (about 2 seconds) before the beep, so you can get ready. The response timer starts after the beep for each question. The test moves on by itself, like the real exam. Use <b>Back</b> to try a question again.</p>
    <label class="opt"><input type="checkbox" id="recChk" checked> Record my answers so I can listen to them at the end (asks for microphone access)</label>
    <p class="note">Turn your sound on. If the microphone isn't available, the test still runs; it just won't record.</p>
    <button class="bigbtn" type="button" id="go">START</button></div>`;
  $('go').onclick=async()=>{
    recOn=$('recChk').checked;
    try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){}
    try{ aud.src=M.dir_lr; aud.muted=true; const pp=aud.play(); if(pp) await pp.catch(()=>{}); aud.pause(); aud.currentTime=0; aud.muted=false; }catch(e){ aud.muted=false; }
    const ok=await initMic();
    started=true; total=0; cur=1; render();
    if(recOn && !ok) { const n=document.createElement('p'); n.className='note'; n.textContent='Microphone not available: your answers will not be recorded.'; main.prepend(n); }
  };
}
function endScreen(){
  const ks=Object.keys(recs).length;
  const inFrame = (()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
  let h=`<div class="card"><h2>Answer key</h2><p>${ks?'Play the original sentence or question, then your recording, and compare them.':'Read the answer key and play each original again. (Your answers were not recorded: the microphone was off or not available.)'}</p>
    <button class="ghostbtn" type="button" id="again">Start over</button></div><div class="recs">`;
  KEY.forEach((t,i)=>{ const n=i+1, r=recs[n];
    if(n===1||n===8) h+=`<h3 class="sh">${n===1?'Part 1: Listen and Repeat':'Part 2: Take an Interview'}</h3>`;
    h+=`<div class="rec keyrow"><div class="kq"><span class="kn">${n}</span><span class="kt">${t||'Question '+n+': play the original to check'}</span></div>

      ${r?`<span class="lab">Your answer</span><audio controls src="${r.url}"></audio>${inFrame?'':`<a href="${r.url}" download="repeat-q${n}.${r.type.includes('mp4')?'m4a':'webm'}">Save</a>`}`:'<span class="lab muted">No recording</span>'}</div></div>`;
  });
  main.innerHTML=h+'</div>'; $('again').onclick=()=>{ cur=1; render(); };
  main.querySelectorAll('[data-orig]').forEach(b=>b.onclick=()=>{ document.querySelectorAll('.rec audio').forEach(a=>a.pause()); aud.onended=null; aud.ontimeupdate=null; aud.src=M['q'+b.dataset.orig]; aud.currentTime=0; const p=aud.play(); if(p&&p.catch) p.catch(()=>{}); });
  main.querySelectorAll('.rec audio').forEach(a=>a.addEventListener('play',()=>aud.pause()));
}
function go(d){ cur=Math.max(0,Math.min(SCREENS.length-1,cur+d)); render(); window.scrollTo(0,0); }
$('backBtn').onclick=()=>go(-1); $('nextBtn').onclick=()=>go(1);
render();
</script>
